function launchLink(k){const base=MODE==='api'?location.origin+location.pathname:WEBAPP_URL;return base?`${base}?site=${encodeURIComponent(k)}`:''}
async function copyText(t,msg){try{await navigator.clipboard.writeText(t);toast(msg||'Copied')}
  catch(e){await ask({title:'Copy this link',body:`<input readonly value="${esc(t)}" style="width:100%;padding:6px;border:1px solid var(--line);border-radius:6px" onfocus="this.select()">`,ok:'Done',cancel:''})}}
function renderSetup(v){const ad=CAN_ADMIN&&CAN_WRITE&&!!CFG;const dis=ad?'':'disabled';const keys=allowedSites();
  v.innerHTML=`<h1>Sites &amp; Export</h1><p class="sub">${MODE==='api'?'Entries save on this device first, then sync to the NH Site Docs Google Sheet. Formal reports are also kept as Google Docs in each site\'s Drive folder.':MODE==='gas'?'Entries save to the NH Site Docs Google Sheet, and every device sees them within about 20 seconds.':SHARED?'Entries save to this page\'s shared log, and everyone it\'s shared with sees them live.':'Entries are saved in this browser only.'} Managers set up, open and close sites here.</p>
  <div class="grid g2" style="align-items:start">
   <div class="card" style="grid-column:1/-1"><b style="font-size:16px">Sites</b><p class="meta" style="margin-top:2px">Each site keeps its own staff, participants, contacts, logs and inventory. Closing a site keeps every record, hides it from the site picker and stops new entries being expected.${SERVER()?' A site\'s <b>launch link</b> opens the app straight to that site: open it on that site\'s computer, tablet or phone, then install the app.':''}</p>
    <div class="tblwrap" style="margin-top:8px"><table><thead><tr><th>Site</th><th>Status</th><th>Units</th><th>Participants</th><th>Staff</th>${SERVER()?'<th>Launch link</th>':''}<th></th></tr></thead><tbody>
    ${keys.map(k=>{const s=S().sites[k];const act=pplOf(k).filter(p=>p.status==='Active').length;return `<tr><td><b>${esc(s.name)}</b><div class="meta" style="margin:0">${esc(s.address||'')}</div></td>
     <td>${s.status==='Archived'?pill(`Closed ${fmtDate(s.closed)}`,''):pill('Open','ok')}</td>
     <td style="white-space:nowrap">${s.units.length} ${ad&&s.status!=='Archived'?`<button class="btn sm" type="button" data-addu="${esc(k)}" aria-label="Add a unit to ${esc(s.name)}">＋</button><button class="btn sm" type="button" data-rmu="${esc(k)}" aria-label="Remove the last unit from ${esc(s.name)}">−</button>`:''}</td>
     <td>${act}</td><td>${staffOf(k).filter(x=>x.status==='Active').length}</td>
     ${SERVER()?`<td><button class="btn sm" type="button" data-link="${esc(k)}">Copy link</button></td>`:''}
     <td style="white-space:nowrap">${ad?(s.status==='Archived'?`<button class="btn sm" type="button" data-reopen="${esc(k)}">Reopen</button>`:`<button class="btn sm danger" type="button" data-close="${esc(k)}">Close site</button>`):''}
      ${s.status==='Archived'&&k!==curSite()?`<button class="btn sm" type="button" data-view="${esc(k)}">View records</button>`:''}</td></tr>`}).join('')}</tbody></table></div>
    ${ad?`<button class="btn pri" type="button" id="addSite" style="margin-top:10px">＋ Open a new site</button>`:''}</div>
   <div class="card"><b style="font-size:16px">Export</b>
    <div class="qa" style="margin-top:10px"><button class="btn acc" type="button" id="xlsx">⇩ Export all to Excel (.xlsx)</button><button class="btn" type="button" id="json">⇩ Backup (.json)</button></div>
    ${SHEET_URL||ARCHIVE_URL?`<div class="qa" style="margin-top:8px">${SHEET_URL?`<a class="btn" href="${esc(SHEET_URL)}" target="_blank" rel="noopener">Open the data sheet ↗</a>`:''}${ARCHIVE_URL?`<a class="btn" href="${esc(ARCHIVE_URL)}" target="_blank" rel="noopener">Open the records folder in Drive ↗</a>`:''}</div>`:''}
    <p class="meta">Excel has one tab per log (named like the 12N Site Operations template), plus Participants, Staff Roster and Contacts. Keep exports in an access-restricted folder.</p>
    <table style="margin-top:8px">${MODS.map(m=>`<tr><td>${esc(M[m].nav)}</td><td style="text-align:right;font-variant-numeric:tabular-nums">${recs(m).length}</td></tr>`).join('')}</table>
    <hr style="border:0;border-top:1px solid var(--line);margin:14px 0">
    <b>Import a backup</b><p class="meta" style="margin-top:2px">Adds the entries, staff and participants from a backup (.json) file. Records already here are kept.${!CAN_WRITE?' Needs Staff or Admin access.':''}</p>
    <label class="btn ${CAN_WRITE?'':'disabled'}" for="importFile">⇧ Choose backup file</label><input id="importFile" type="file" accept=".json,application/json" hidden ${CAN_WRITE?'':'disabled'}></div>
   <div class="card"><b style="font-size:16px">Organization</b>
    <div class="fld" style="margin-top:8px"><label for="portalUrl">12N Staff Portal link</label><input id="portalUrl" type="url" ${dis} value="${esc(CFG&&CFG.portalUrl||'')}" placeholder="https://sites.google.com/…"><span class="hint">Shown in the menu so staff can jump to the portal.</span></div>
    ${MODE==='api'?`<hr style="border:0;border-top:1px solid var(--line);margin:14px 0"><b>This device</b><p class="meta" style="margin-top:2px">Signed in as ${esc(MY_UID||'')}. ${PENDING?`<b>${PENDING} change${PENDING>1?'s are':' is'} waiting to sync.</b>`:'Everything is synced.'}</p><div class="qa">${INSTALL_PROMPT?'<button class="btn pri" type="button" id="installApp">Install this app</button>':''}<button class="btn" type="button" id="syncNow">Sync now</button><button class="btn danger" type="button" id="signOut">Sign out of this device</button></div>`:''}
    ${SERVER()?`<hr style="border:0;border-top:1px solid var(--line);margin:14px 0"><b>Install on a device</b>
    <p class="meta" style="margin-top:2px">Open the site's launch link on the device, then:<br>
     <b>Computer (Chrome or Edge):</b> menu ⋮ → Cast, save and share → <i>Install page as app</i> (Edge: Apps → <i>Install this site as an app</i>).<br>
     <b>Android:</b> Chrome menu ⋮ → <i>Add to Home screen</i>.<br>
     <b>iPad / iPhone:</b> Safari Share button → <i>Add to Home Screen</i>.<br>
     For a shared site device, sign it in with a site Google account and set that account's site on the Access tab.</p>`:''}</div>
  </div>`;
  $('#xlsx').onclick=exportExcel;$('#json').onclick=exportJSON;$('#importFile').onchange=e=>importJSON(e.target.files[0]);
  const ia=$('#installApp');if(ia)ia.onclick=async()=>{try{INSTALL_PROMPT.prompt();await INSTALL_PROMPT.userChoice}catch(e){}INSTALL_PROMPT=null;render()};
  const sn=$('#syncNow');if(sn)sn.onclick=()=>{if(API)API.poll();toast('Syncing…')};
  const so=$('#signOut');if(so)so.onclick=signOut;
  const pu=$('#portalUrl');pu.onchange=()=>{const val=pu.value.trim();if(val&&!/^https:\/\//.test(val)){toast('Use a full https:// link.','err');return}cfgSave(()=>{CFG.portalUrl=val},'Portal link saved')};
  v.querySelectorAll('[data-link]').forEach(b=>b.onclick=()=>copyText(launchLink(b.dataset.link),`Launch link for ${S().sites[b.dataset.link].name} copied`));
  v.querySelectorAll('[data-addu]').forEach(b=>b.onclick=()=>cfgSave(()=>{const u=CFG.sites[b.dataset.addu].units;const next=u.reduce((m,x)=>Math.max(m,+x.no||0),0)+1;u.push(...mkUnits(1,next))},'Unit added'));
  v.querySelectorAll('[data-rmu]').forEach(b=>b.onclick=async()=>{const u=CFG.sites[b.dataset.rmu].units;if(!u.length)return;const last=u[u.length-1];
    if(last.participantId||last.status==='Occupied')return toast(`Unit ${last.no} is occupied. Move the participant out first.`,'err');
    if(!await ask({title:`Remove unit ${last.no}?`,body:'Past log entries for this unit keep their unit number.',ok:'Remove',danger:true}))return;cfgSave(()=>u.pop(),'Unit removed')});
  v.querySelectorAll('[data-close]').forEach(b=>b.onclick=async()=>{const k=b.dataset.close,s=S().sites[k];const act=pplOf(k).filter(p=>p.status==='Active').length;
    const a=await ask({title:`Close ${s.name}?`,body:`${act?`<b>${act} participant${act>1?'s are':' is'} still active.</b> Move them out first if they have left.\n\n`:''}The site and all its records are kept. It disappears from the site picker, and you can reopen it at any time.`,ok:'Close site',danger:true,fields:[{l:'Closing date',t:'date',v:today()}]});
    if(a)cfgSave(()=>{Object.assign(CFG.sites[k],{status:'Archived',closed:a[0]||today()})},`${s.name} closed`)});
  v.querySelectorAll('[data-reopen]').forEach(b=>b.onclick=()=>cfgSave(()=>{Object.assign(CFG.sites[b.dataset.reopen],{status:'Active',closed:''})},'Site reopened'));
  v.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{SHOW_CLOSED=true;PREF.site=b.dataset.view;subscribeSite();go('dash')});
  const as=$('#addSite');if(as)as.onclick=async()=>{const a=await ask({title:'Open a new site',ok:'Create site',fields:[{l:'Site name',req:1},{l:'Address',v:''},{l:'Number of units',t:'number',v:0},{l:'Opening date',t:'date',v:today()}]});if(!a)return;
    const k='s'+uid();await cfgSave(()=>{const s=mkSite(a[0].trim(),Math.max(0,Math.min(200,+a[2]||0)));s.address=a[1].trim();s.opened=a[3]||today();CFG.sites[k]=s},'Site created');
    if(CFG.sites[k]){PREF.site=k;savePref();subscribeSite();go('dash')}}}

async function download(name,data){
  if(DL){try{await DL.save({filename:name,data});toast('Saved '+name)}catch(e){if(e&&e.code!=='declined')toast('Could not save the file'+(e&&e.message?': '+e.message:''),'err')}return}
  if(MODE==='claude'){toast('Downloads aren\'t available in this view.','err');return}
  const b=data instanceof Blob?data:new Blob([data]);const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
/* One record as readable label → value pairs (Excel export and the Google Sheet's columns). */
function recFlat(m,r){const o={Site:S().sites[r.site]?.name||r.site||''};
  for(const f of fieldsOf(m)){const v=r[f.k];
    if(f.t==='yntable'&&f.vals){for(const lb of f.o.map(optLabel)){const x=(v||{})[lb]||{};o[lb]=(x.v||'')+(x.n?` – ${x.n}`:'')}continue} /* rating tables: one column per item */
    o[f.l]=f.t==='unit'?(r[f.k+'Label']||unitLabel(v)):f.t==='multi'?(v||[]).join('; '):f.t==='yntable'?f.o.map(optLabel).map(o2=>`${o2}: ${(v||{})[o2]?.v||'-'}${(v||{})[o2]?.n?' ('+v[o2].n+')':''}`).join('; '):(v??'')}
  Object.assign(o,{'On shift':(r.shiftStaff||[]).join(' & '),Created:r.createdAt||'','Created by':r.createdBy||'','Last edited':r.updatedAt||'','Edited by':r.updatedBy||''});return o}
function flatRows(m,all){const objs=sorted(all?recs(m):siteRecs(m)).map(r=>recFlat(m,r));const head=Object.keys(recFlat(m,{}));return [head,...objs.map(o=>head.map(h=>o[h]))]}
function flatFor(c,d){
  if(c.startsWith('log-')&&M[c.slice(4)])return recFlat(c.slice(4),d);
  const sc=c.match(/^sites\/([^/]+)\/schedule$/);
  if(sc){const o={Site:S().sites[sc[1]]?.name||sc[1],'Week of':d.week,Published:d.published?'Yes':'No'};weekDays(d.week).forEach(ds=>SHIFTS.forEach((sh,i)=>{o[`${dayName(ds)} ${ds.slice(5)} · ${sh.split(' ')[0]}`]=((d.days||{})[ds]||{})[i]?.filter(Boolean).join(' & ')||''}));o.Notes=d.notes||'';return o}
  const sm=c.match(/^sites\/([^/]+)\/(staff|participants)$/);
  if(sm){const sn=S().sites[sm[1]]?.name||sm[1];return sm[2]==='staff'?{Site:sn,Name:d.name,Role:d.role,Phone:d.phone,Email:d.email,Start:d.start||'',End:d.end||'',Status:d.status}
    :{Site:sn,Participant:d.name,Status:d.status==='Active'?'Current':'Past',Unit:d.unit,'Moved in':d.moveIn,'Moved out':d.moveOut,'Exit reason':d.exitReason,'Approved appliances':d.appliances,Notes:d.notes}}
  if(c.startsWith('inv-')){const i=invCalc(d);return {Site:S().sites[c.slice(4)]?.name||c.slice(4),'Inventory ID':i.id,Category:i.cat,Item:i.item,Type:i.type,Frequency:i.freq,'Office Qty':i.office,'Bathroom Qty':i.bath,'Guest Unit Qty':i.guest,'Total Stock':i.total,'Par Level':i.par,'Stock Status':i.status,'Qty to Order':i.order,Condition:i.cond}}
  return {}}
const csvCell=v=>{v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
const toCsv=rows=>'﻿'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n');
function exportCSV(m){download(`12N-${M[m].sheet.replace(/\W+/g,'-')}-${today()}.csv`,toCsv(flatRows(m)))}
const invRows=k=>[['Inventory ID','Inventory Type','Category','Item','Replacement Frequency','Office Qty','Bathroom Qty','Guest Unit Qty','Total Stock','Par Level','Stock Status','Qty to Order','Condition'],...(INV[k]||[]).map(invCalc).map(i=>[i.id,i.type,i.cat,i.item,i.freq,i.office,i.bath,i.guest,i.total,i.par,i.status,i.order,i.cond])];
function exportInvCSV(){download(`12N-Inventory-${today()}.csv`,toCsv(invRows(curSite())))}
function exportExcel(){
  if(!window.XLSX){toast('The Excel exporter did not load. Use the CSV buttons on each log instead.','err');return}
  const wb=XLSX.utils.book_new();const used=new Set();
  const add=(name,rows)=>{let n=name.replace(/[\[\]:*?\/\\]/g,'').slice(0,31);while(used.has(n))n=n.slice(0,28)+'~'+used.size;used.add(n);const ws=XLSX.utils.aoa_to_sheet(rows);ws['!cols']=rows[0].map(()=>({wch:20}));XLSX.utils.book_append_sheet(wb,ws,n)};
  for(const m of MODS)add(M[m].sheet,flatRows(m,true));
  for(const k in S().sites)add('Inventory '+S().sites[k].name,invRows(k));
  add('Site Details Data',[['Site','Site status','Address','Unit','Unit status','Current participant','Unit notes'],...Object.entries(S().sites).flatMap(([k,s])=>s.units.map(u=>[s.name,s.status==='Archived'?'Closed':'Open',s.address,u.no,u.status,(pplOf(k).find(p=>p.id===u.participantId)||{}).name||u.name||'',u.notes]))]);
  add('Participants',[['Site','Participant','Status','Unit','Moved in','Moved out','Exit reason','Approved appliances','Notes','History'],...Object.entries(S().sites).flatMap(([k,s])=>pplOf(k).map(p=>[s.name,p.name,p.status==='Active'?'Current':'Past',p.unit,p.moveIn,p.moveOut,p.exitReason,p.appliances,p.notes,(p.history||[]).map(h=>`${h.date} ${h.event}`).join('; ')]))]);
  add('Schedule',[['Site','Date','Shift','Staff 1','Staff 2','Published'],...Object.entries(S().sites).flatMap(([k,s])=>(SCHED[k]||[]).flatMap(w=>weekDays(w.week).flatMap(ds=>SHIFTS.map((sh,i)=>{const a=((w.days||{})[ds]||{})[i]||[];return [s.name,ds,sh,a[0]||'',a[1]||'',w.published?'Yes':'No']}).filter(r=>r[3]||r[4]))))]);
  add('Staff Roster',[['Site','Name','Role','Phone','Email','Start','End','Status'],...Object.entries(S().sites).flatMap(([k,s])=>staffOf(k).map(x=>[s.name,x.name,x.role,x.phone,x.email,x.start||'',x.end||'',x.status]))]);
  add('Contacts',[['Site','Role','Contact name','Phone / email','Escalate for'],...Object.values(S().sites).flatMap(s=>[[s.name,'Police non-emergency','',s.nonEmergency,''],[s.name,'Site phone','',s.sitePhone,''],...(s.contacts||[]).map(c=>[s.name,c.role,c.name,c.reach,c.when])])]);
  const buf=XLSX.write(wb,{bookType:'xlsx',type:'array'});download(`12N-NH-Site-Operations-${today()}.xlsx`,new Blob([buf]))}
function exportJSON(){download(`12N-NH-backup-${today()}.json`,JSON.stringify({v:2,settings:clone(S()),rec:Object.fromEntries(MODS.map(m=>[m,recs(m)])),inv:INV,staff:STAFF,participants:PPL,schedule:SCHED},null,1))}
function importJSON(file){if(!file)return;const rd=new FileReader();rd.onload=async()=>{let d;try{d=JSON.parse(rd.result);if(!d||!d.rec)throw 0}catch(e){toast('That file is not a valid backup.','err');return}
  // Site setup (sites, staff and participant rosters, contacts): managers only, and only when asked.
  if(d.settings&&d.settings.sites&&CAN_ADMIN){const names=Object.values(d.settings.sites).map(s=>s.name).join(', ');
    if(await ask({title:'Also copy the site setup?',body:`The backup includes setup for: ${names}.\nThis replaces the sites, staff rosters, participant rosters and contacts here.`,ok:'Replace setup',cancel:'Keep current setup'})){
      const before=CFG;CFG=normalizeCfg(clone(d.settings));try{await putCfg();toast('Site setup copied')}catch(e){CFG=before;writeErr(e);return}}}
  const incoming=[];for(const m of MODS)for(const r of (d.rec[m]||[]))if(r&&r.id&&!recs(m).some(x=>x.id===r.id))incoming.push([m,r]);
  // Staff and participant records (backups from this version)
  if(CAN_ADMIN)for(const kind of ['staff','participants','schedule']){const src=d[kind]||{};let n=0;
    for(const k in src)if(S().sites[k])for(const x of src[k]||[]){const have=kind==='staff'?STAFF[k]:kind==='schedule'?SCHED[k]:PPL[k];if(x&&x.id&&!(have||[]).some(y=>y.id===x.id)){try{await putSub(k,kind,x);n++}catch(e){writeErr(e);break}}}
    if(n)toast(`Imported ${n} ${kind==='staff'?'staff records':'participant records'}`)}
  const invIn=[];for(const k in (d.inv||{}))if(S().sites[k])for(const it of d.inv[k]||[])if(it&&it.id&&!(INV[k]||[]).some(x=>x.id===it.id))invIn.push([k,it]);
  if(!incoming.length&&!invIn.length){toast('Every entry in that backup is already here.');return}
  if(!await ask({title:`Import ${incoming.length} entr${incoming.length===1?'y':'ies'}${invIn.length?` and ${invIn.length} inventory items`:''}?`,body:'They will be added to the shared log for everyone. Entries already here are kept.',ok:'Import'}))return;
  let n=0;const total=incoming.length+invIn.length;
  try{for(const [m,r] of incoming){if(!S().sites[r.site])r.site=curSite();await putRec(m,r);n++;if(n%20===0)toast(`Importing… ${n}/${total}`)}
    for(const [k,it] of invIn){await putInv(k,it);n++;if(n%20===0)toast(`Importing… ${n}/${total}`)}toast(`Imported ${n} items`)}catch(e){writeErr(e);toast(`Stopped after ${n} of ${total}`,'err')}};rd.readAsText(file)}

function toast(msg,kind){document.querySelectorAll('.toast').forEach(x=>x.remove());const t=document.createElement('div');t.className='toast '+(kind||'');t.setAttribute('role','status');t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),kind==='err'?4500:2200)}

/* =========================================================
   BOOT
   ========================================================= */
setInterval(()=>{$('#shiftPill').textContent=shiftFor();if(SHARED)subscribeSite();if(cur==='dash'&&!$('#scrim')&&!$('.dlg'))scheduleRender()},60000);
/* ---------- Standalone mode: Google Apps Script web app backed by a Google Sheet ----------
   Same document API the page uses on claude.ai (doc/collection, set/delete, onSnapshot),
   kept fresh by polling the server for rows changed since the last check. */
function makeGasDb(){
  const store=new Map(),listeners=new Set();let since=0,ready=false,timer=null,busy=false;
  const col=c=>{if(!store.has(c))store.set(c,new Map());return store.get(c)};
  const toErr=e=>{const m=String(e&&e.message||e||'');return /DENIED:/.test(m)?{code:'invalid_argument',message:m.replace(/^.*DENIED:\s*/,'')}:{code:'unavailable',message:m||'connection problem'}};
  const run=(fn,...a)=>new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(e=>rej(toErr(e)))[fn](...a));
  const md={fromCache:false,hasPendingWrites:false};
  function notify(touched){for(const l of listeners)if(!touched||touched.has(l.c))l.fire()}
  function apply(docs){const t=new Set();for(const x of docs){const m=col(x.c);if(x.del)m.delete(x.id);else m.set(x.id,x.d);t.add(x.c)}return t}
  async function poll(){if(busy)return;busy=true;
    try{const r=await run('changes',Math.max(0,since-5000));since=Math.max(since,+r.ts||0);const t=apply(r.docs||[]);
      if(GAS_OFFLINE){GAS_OFFLINE=false;scheduleRender()}
      if(!ready){ready=true;notify(null)}else if(t.size)notify(t)}
    catch(e){if(!GAS_OFFLINE){GAS_OFFLINE=true;scheduleRender()}}
    finally{busy=false;updateSync()}}
  function start(){poll();clearInterval(timer);timer=setInterval(()=>{if(!document.hidden)poll()},20000);
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});window.addEventListener('focus',poll)}
  function listen(c,fire){const l={c,fire};listeners.add(l);if(ready)setTimeout(fire,0);return ()=>listeners.delete(l)}
  function query(c,ord,lim){return{
    orderBy:(f,d)=>query(c,[f,d||'asc'],lim),limit:n=>query(c,ord,n),
    onSnapshot(next){return listen(c,()=>{let list=[...col(c).entries()].map(([id,d])=>({id,d}));
      if(ord){const [f,dir]=ord;list.sort((a,b)=>String(a.d[f]??'').localeCompare(String(b.d[f]??''))*(dir==='desc'?-1:1))}
      if(lim)list=list.slice(0,lim);
      const docs=list.map(x=>({id:x.id,exists:true,data:()=>x.d,metadata:md}));next({docs,size:docs.length,empty:!docs.length,metadata:md,docChanges:()=>[]})})}}}
  function docRef(c,id){return{id,path:c+'/'+id,
    async set(data){const prev=col(c).get(id);const body=clone(data);col(c).set(id,body);notify(new Set([c]));
      let flat={};try{flat=flatFor(c,body)}catch(e){}
      try{const r=await run('put',c,id,JSON.stringify(body),JSON.stringify(flat));since=Math.max(since,0)}
      catch(e){if(prev===undefined)col(c).delete(id);else col(c).set(id,prev);notify(new Set([c]));throw e}},
    async delete(){const prev=col(c).get(id);col(c).delete(id);notify(new Set([c]));
      try{await run('remove',c,id)}catch(e){if(prev!==undefined)col(c).set(id,prev);notify(new Set([c]));throw e}},
    onSnapshot(next){return listen(c,()=>{const d=col(c).get(id);next({id,exists:d!==undefined,data:()=>d,metadata:md})})}}}
  const db={doc(p){const s=p.split('/');return docRef(s.slice(0,-1).join('/'),s[s.length-1])},
    collection(c){const q=query(c,null,null);q.doc=id=>docRef(c,id||uid());q.path=c;return q}};
  return {db,start,run,poll}}

/* ---------- Installed app mode: works offline, syncs with the Apps Script server ----------
   Every change is saved on this device first (IndexedDB) and queued; the queue is sent in order
   whenever there is a connection and a valid Google sign-in. The server's changes are pulled
   every 20 seconds and when the app comes back to the foreground. */
const idb=(()=>{let dbp=null;
  const open=()=>dbp||(dbp=new Promise((res,rej)=>{const r=indexedDB.open('nh-site-docs',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
  const tx=(mode,fn)=>open().then(db=>new Promise((res,rej)=>{const t=db.transaction('kv',mode);const req=fn(t.objectStore('kv'));t.oncomplete=()=>res(req&&req.result);t.onerror=()=>rej(t.error)}));
  return {get:k=>tx('readonly',s=>s.get(k)),set:(k,v)=>tx('readwrite',s=>s.put(v,k)),clear:()=>tx('readwrite',s=>s.clear())}})();

function makeApiDb(){
  const store=new Map(),listeners=new Set(),pendingKeys=new Set();let since=0,ready=false,busy=false,outbox=[],saveT=null,timer=null;
  const col=c=>{if(!store.has(c))store.set(c,new Map());return store.get(c)};
  const md={fromCache:false,hasPendingWrites:false};
  const toErr=m=>{m=String(m||'');return /AUTH:/.test(m)?{code:'unauthenticated',message:m.replace(/^.*AUTH:\s*/,'')}:/DENIED:/.test(m)?{code:'invalid_argument',message:m.replace(/^.*DENIED:\s*/,'')}:{code:'unavailable',message:m||'connection problem'}};
  async function run(fn,...args){
    if(navigator.onLine===false)throw {code:'unavailable',message:'No internet connection'};
    const token=await getToken();if(!token){needSignIn();throw {code:'unauthenticated',message:'Sign in again'}}
    let r;try{const res=await fetch(NH_CONFIG.apiUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn,args,token}),redirect:'follow'});r=await res.json()}
    catch(e){throw {code:'unavailable',message:'Can\'t reach the server'}}
    if(!r||!r.ok){const e=toErr(r&&r.error);if(e.code==='unauthenticated'){forgetToken();needSignIn()}throw e}
    return r.result}
  function notify(t){for(const l of listeners)if(!t||t.has(l.c))l.fire()}
  function persist(){clearTimeout(saveT);saveT=setTimeout(()=>{idb.set('store',[...store].map(([c,m])=>[c,[...m]])).catch(()=>{});idb.set('since',since).catch(()=>{});idb.set('outbox',outbox).catch(()=>{})},300)}
  function counts(){pendingKeys.clear();outbox.forEach(o=>pendingKeys.add(o.c+'|'+o.id));const before=PENDING;PENDING=outbox.length;if(before!==PENDING){updateSync();scheduleRender()}}
  function apply(docs){const t=new Set();for(const x of docs){if(pendingKeys.has(x.c+'|'+x.id))continue;const m=col(x.c);if(x.del)m.delete(x.id);else m.set(x.id,x.d);t.add(x.c)}return t}
  /* op.prev = the value before this device's unsynced changes, so a refused change can be undone here too. */
  function queue(op){const earlier=outbox.find(o=>o.c===op.c&&o.id===op.id);if(earlier)op.prev=earlier.prev;outbox=outbox.filter(o=>o!==earlier);outbox.push(op);counts();persist();setTimeout(poll,30)}
  function undo(o){const m=col(o.c);if(o.prev==null)m.delete(o.id);else m.set(o.id,o.prev);notify(new Set([o.c]))}
  async function flush(){
    while(outbox.length){const o=outbox[0];
      try{if(o.op==='put')await run('put',o.c,o.id,o.json,o.flat);else await run('remove',o.c,o.id)}
      catch(e){if(e.code==='invalid_argument'){toast('A change could not be saved: '+e.message,'err');outbox.shift();counts();undo(o);persist();continue}throw e}
      outbox.shift();counts();persist()}}
  async function poll(){if(busy)return;busy=true;const wasOff=GAS_OFFLINE;
    try{await flush();const r=await run('changes',Math.max(0,since-5000));since=Math.max(since,+r.ts||0);const t=apply(r.docs||[]);persist();
      GAS_OFFLINE=false;if(!ready){ready=true;notify(null)}else if(t.size)notify(t)}
    catch(e){if(e.code==='unavailable')GAS_OFFLINE=true}
    finally{busy=false;updateSync();if(wasOff!==GAS_OFFLINE)scheduleRender()}}
  async function load(){try{const [s,sn,ob]=await Promise.all([idb.get('store'),idb.get('since'),idb.get('outbox')]);
    if(s)for(const [c,arr] of s)store.set(c,new Map(arr));since=+sn||0;outbox=Array.isArray(ob)?ob:[];counts();if(s&&s.length){ready=true;notify(null)}}catch(e){}}
  function start(){poll();clearInterval(timer);timer=setInterval(()=>{if(!document.hidden)poll()},20000);
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});window.addEventListener('online',poll);window.addEventListener('focus',poll)}
  function listen(c,fire){const l={c,fire};listeners.add(l);if(ready)setTimeout(fire,0);return ()=>listeners.delete(l)}
  function query(c,ord,lim){return{orderBy:(f,d)=>query(c,[f,d||'asc'],lim),limit:n=>query(c,ord,n),
    onSnapshot(next){return listen(c,()=>{let list=[...col(c).entries()].map(([id,d])=>({id,d}));
      if(ord){const [f,dir]=ord;list.sort((a,b)=>String(a.d[f]??'').localeCompare(String(b.d[f]??''))*(dir==='desc'?-1:1))}
      if(lim)list=list.slice(0,lim);const docs=list.map(x=>({id:x.id,exists:true,data:()=>x.d,metadata:md}));next({docs,size:docs.length,empty:!docs.length,metadata:md,docChanges:()=>[]})})}}}
  function docRef(c,id){return{id,path:c+'/'+id,
    async set(data){const before=col(c).get(id);const body=clone(data);col(c).set(id,body);notify(new Set([c]));let flat={};try{flat=flatFor(c,body)}catch(e){}
      queue({op:'put',c,id,json:JSON.stringify(body),flat:JSON.stringify(flat),prev:before===undefined?null:clone(before)})},
    async delete(){const before=col(c).get(id);col(c).delete(id);notify(new Set([c]));queue({op:'remove',c,id,prev:before===undefined?null:clone(before)})},
    onSnapshot(next){return listen(c,()=>{const d=col(c).get(id);next({id,exists:d!==undefined,data:()=>d,metadata:md})})}}}
  const db={doc(p){const s=p.split('/');return docRef(s.slice(0,-1).join('/'),s[s.length-1])},collection(c){const q=query(c,null,null);q.doc=id=>docRef(c,id||uid());q.path=c;return q}};
  async function clearAll(){store.clear();outbox=[];since=0;counts();try{await idb.clear()}catch(e){}}
  return {db,start,run,poll,load,clearAll,pending:()=>outbox.length}}

/* ---------- Google sign-in (Google Identity Services) ---------- */
let TOKEN=null,TOKEN_EXP=0,gisReady=null,credWaiters=[],AFTER_SIGNIN=null;
const jwtExp=t=>{try{return JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).exp*1000}catch(e){return 0}};
try{const s=JSON.parse(localStorage.getItem('nh-token')||'null');if(s&&s.exp>Date.now()+60000){TOKEN=s.t;TOKEN_EXP=s.exp}}catch(e){}
function forgetToken(){TOKEN=null;TOKEN_EXP=0;try{localStorage.removeItem('nh-token')}catch(e){}}
function loadGis(){return gisReady||(gisReady=new Promise((res,rej)=>{
    if(window.google&&google.accounts&&google.accounts.id)return res();
    const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;s.onload=()=>res();s.onerror=()=>{gisReady=null;rej(new Error('Google sign-in could not load. Check the connection.'))};document.head.appendChild(s)})
  .then(()=>google.accounts.id.initialize({client_id:NH_CONFIG.clientId,callback:onCredential,auto_select:true,cancel_on_tap_outside:false,itp_support:true,use_fedcm_for_prompt:true,hd:NH_CONFIG.domain||undefined})))}
function onCredential(resp){if(!resp||!resp.credential)return;TOKEN=resp.credential;TOKEN_EXP=jwtExp(TOKEN);
  try{localStorage.setItem('nh-token',JSON.stringify({t:TOKEN,exp:TOKEN_EXP}))}catch(e){}
  credWaiters.splice(0).forEach(f=>f(TOKEN));
  if(SIGNIN_NEEDED){SIGNIN_NEEDED=false;updateSync();scheduleRender()}
  if(AFTER_SIGNIN){const f=AFTER_SIGNIN;AFTER_SIGNIN=null;f()}else if(API)API.poll()}
async function getToken(){
  if(TOKEN&&TOKEN_EXP>Date.now()+60000)return TOKEN;
  if(SIGNIN_NEEDED)return null;
  try{await loadGis()}catch(e){return null}
  return new Promise(res=>{const first=!credWaiters.length;credWaiters.push(res);
    if(first)try{google.accounts.id.prompt()}catch(e){}
    setTimeout(()=>{const i=credWaiters.indexOf(res);if(i>=0){credWaiters.splice(i,1);res(null)}},8000)})}
function needSignIn(){if(!SIGNIN_NEEDED){SIGNIN_NEEDED=true;updateSync();scheduleRender()}}
function renderSignInButton(el){loadGis().then(()=>{el.innerHTML='';google.accounts.id.renderButton(el,{theme:'outline',size:'large',text:'signin_with',shape:'pill'})}).catch(e=>{el.textContent=e.message})}
async function signOut(){const n=API?API.pending():0;
  if(!await ask({title:'Sign out of this device?',body:(n?`<b>${n} change${n>1?'s have':' has'} not synced yet and will be lost.</b> Connect to the internet and wait for them to sync first.\n\n`:'')+'This removes the records stored on this device. Everything already synced stays in Google Drive.',ok:'Sign out',danger:true}))return;
  try{if(window.google&&google.accounts&&google.accounts.id)google.accounts.id.disableAutoSelect()}catch(e){}
  forgetToken();try{localStorage.removeItem('nh-session')}catch(e){}if(API)await API.clearAll();location.reload()}
function showSignIn(msg){$('#view').innerHTML=`<div class="card" style="max-width:520px;margin:40px auto;text-align:center">
  <img class="signlogo" src="${LOGO}" alt="the 12 neighbours community" width="400" height="177"><p class="meta" style="margin:0 0 4px">NH Site Docs · Neighbourly Homes</p>
  <h1 style="font-size:20px">Sign in</h1><p class="sub" style="margin:6px auto 16px">Use your ${esc(NH_CONFIG.domain||'12 Neighbours')} Google account. After the first sign-in, this device keeps working even without internet.</p>
  ${msg?`<div class="infob warn" style="text-align:left;margin-bottom:14px">${esc(msg)}</div>`:''}<div id="gisMain" style="display:flex;justify-content:center;min-height:44px"></div></div>`;
  renderSignInButton($('#gisMain'))}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();INSTALL_PROMPT=e;if(cur==='setup')scheduleRender()});

async function bootApi(){
  MODE='api';
  if(!NH_CONFIG.apiUrl||!NH_CONFIG.clientId){$('#view').innerHTML=`<div class="card empty">This copy of NH Site Docs isn't connected yet. A manager needs to fill in <b>config.js</b> (see SETUP.md).</div>`;return}
  try{LAUNCH_SITE=new URLSearchParams(location.search).get('site')||''}catch(e){}
  API=makeApiDb();GAS=API;await API.load();
  let sess=null;try{sess=JSON.parse(localStorage.getItem('nh-session')||'null')}catch(e){}
  const applySess=u=>{MY_UID=u.email||null;CAN_ADMIN=u.role==='Admin';CAN_SCHEDULE=u.role==='Admin'||u.role==='Supervisor';CAN_WRITE=['Admin','Supervisor','Staff'].includes(u.role);SHEET_URL=u.sheetUrl||'';ARCHIVE_URL=u.recordsUrl||'';ALLOWED_RAW=Array.isArray(u.sites)&&u.sites.length?u.sites:null};
  let started=false;const startApp=()=>{if(started)return;started=true;API_STARTED=true;DBX=API.db;SHARED=true;CFG_READY=false;subscribeAll();API.start();render()};
  const refresh=async()=>{try{const u=await API.run('whoami');if(sess&&sess.email&&u.email!==sess.email){await API.clearAll()}sess=u;localStorage.setItem('nh-session',JSON.stringify(u));applySess(u);startApp();render()}
    catch(e){if(e.code==='invalid_argument'){forgetToken();try{localStorage.removeItem('nh-session')}catch(x){}await API.clearAll();showSignIn(e.message)}
      else if(e.code==='unauthenticated'&&!started){AFTER_SIGNIN=refresh;showSignIn()}else if(!started){GAS_OFFLINE=true;showSignIn('No connection. Connect to the internet for the first sign-in on this device.')}}};
  if(sess){applySess(sess);startApp();refresh()}
  else{AFTER_SIGNIN=refresh;showSignIn();if(TOKEN)refresh()}
  if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{})}

(async function boot(){
  if(window.NH_CONFIG){await bootApi();return}
  if(window.google&&google.script&&google.script.run){
    MODE='gas';const g=makeGasDb();
    try{const u=await g.run('whoami');MY_UID=u.email||null;CAN_ADMIN=u.role==='Admin';CAN_SCHEDULE=u.role==='Admin'||u.role==='Supervisor';CAN_WRITE=['Admin','Supervisor','Staff'].includes(u.role);SHEET_URL=u.sheetUrl||'';ARCHIVE_URL=u.archiveUrl||'';WEBAPP_URL=u.webAppUrl||'';ALLOWED_RAW=Array.isArray(u.sites)&&u.sites.length?u.sites:null;
      LAUNCH_SITE=await new Promise(res=>{try{google.script.url.getLocation(loc=>res((loc&&loc.parameter&&loc.parameter.site)||''))}catch(e){res('')}})}
    catch(e){$('#view').innerHTML=`<div class="card empty"><b>You don't have access to NH Site Docs.</b><br>${esc(e.message||'')}<br>Ask a manager to add your email to the Access tab of the data sheet.</div>`;MODE='denied';return}
    GAS=g;DBX=g.db;SHARED=true;CFG_READY=false;subscribeAll();g.start();render();return}
  if(window.claude&&typeof window.claude.use==='function'){MODE='claude';
    try{[DBX,USER,DL]=await Promise.all([claude.use('db'),claude.use('user'),claude.use('downloads')])}catch(e){}}
  if(DBX){SHARED=true;CFG_READY=false;
    if(USER){try{MY_UID=await USER.id()}catch(e){}try{CAN_ADMIN=await USER.canEdit()}catch(e){CAN_ADMIN=false}CAN_SCHEDULE=CAN_ADMIN;try{const w=await USER.can('data.write');if(w===false)CAN_WRITE=false}catch(e){}}
    else{CAN_ADMIN=false;CAN_SCHEDULE=false}
    subscribeAll()}
  else{MODE='local';try{LAUNCH_SITE=new URLSearchParams(location.search).get('site')||''}catch(e){}loadLocal();applyLaunchSite()}
  render()})();
if(!(window.google&&window.google.script)&&!window.NH_CONFIG)render();
