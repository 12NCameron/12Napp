<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>NH Site Docs</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: deep-blue side nav (12 Neighbours brand) + cream working area; drawer forms slide in from the right.
   Brand colours from the 12N logo: cream #f8f4e9, 12N blue #3b49c0, brush yellow #f9d46b, orange #e2603a. */
:root{
  --bg:#f8f4e9; --panel:#ffffff; --panel2:#fbf8f1; --ink:#1f2240; --ink2:#4a4d68; --ink3:#767990; --line:#e6e0d2; --line2:#f0ebe0;
  --brand:#3443b5; --brand2:#4a58c9; --brandSoft:#e8eaf8; --onBrand:#ffffff; --accent:#b8492a; --accentSoft:#fbe9e1; --sun:#f9d46b; --onSun:#1d2360;
  --ok:#2f7a45; --okSoft:#e3f2e7; --warn:#9a5c08; --warnSoft:#fbf0dc; --bad:#b23a32; --badSoft:#fbe5e2;
  --info:#355f9c; --infoSoft:#e5edf8; --purple:#6b4a9c; --purpleSoft:#efe8f8; --pink:#b03a6e; --pinkSoft:#fbe6ef;
  --infoInk:#22406b; --warnInk:#6b4306;
  --nav:#1d2360; --navInk:#eef0ff; --navMuted:#aab1e2; --navHover:#2a3178; --navLine:#343c86; --scrim:rgba(20,22,50,.45);
  --r:10px; --sh:0 1px 2px rgba(30,30,60,.06),0 4px 14px rgba(30,30,60,.07);
  --font:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14162a; --panel:#1d2038; --panel2:#23274a; --ink:#eceefe; --ink2:#c3c7e6; --ink3:#9095b8; --line:#343a62; --line2:#2a2f52;
  --brand:#9aa5ff; --brand2:#b3bbff; --brandSoft:#2a3168; --onBrand:#11143a; --accent:#f39a74; --accentSoft:#3d2418; --sun:#f9d46b; --onSun:#1d2360;
  --ok:#6cc287; --okSoft:#1d3324; --warn:#e0a84a; --warnSoft:#3a2c14; --bad:#ef7b72; --badSoft:#3d1f1c;
  --info:#8fb2ea; --infoSoft:#1e2a3d; --purple:#b99be6; --purpleSoft:#2c2240; --pink:#ec8fb6; --pinkSoft:#3b1f2c;
  --infoInk:#bcd0f2; --warnInk:#f0cf96; --nav:#0c0e22; --navHover:#1a1e44; --navLine:#232857; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14162a; --panel:#1d2038; --panel2:#23274a; --ink:#eceefe; --ink2:#c3c7e6; --ink3:#9095b8; --line:#343a62; --line2:#2a2f52;
  --brand:#9aa5ff; --brand2:#b3bbff; --brandSoft:#2a3168; --onBrand:#11143a; --accent:#f39a74; --accentSoft:#3d2418; --sun:#f9d46b; --onSun:#1d2360;
  --ok:#6cc287; --okSoft:#1d3324; --warn:#e0a84a; --warnSoft:#3a2c14; --bad:#ef7b72; --badSoft:#3d1f1c;
  --info:#8fb2ea; --infoSoft:#1e2a3d; --purple:#b99be6; --purpleSoft:#2c2240; --pink:#ec8fb6; --pinkSoft:#3b1f2c;
  --infoInk:#bcd0f2; --warnInk:#f0cf96; --nav:#0c0e22; --navHover:#1a1e44; --navLine:#232857; --scrim:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
.pair{display:flex;gap:6px}.pair select{min-width:120px}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
nav.side{background:var(--nav);color:var(--navInk);padding:14px 10px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{padding:2px 4px 14px;border-bottom:1px solid var(--navLine);margin-bottom:8px}
.logo img{display:block;width:100%;height:auto;border-radius:10px;background:#f8f4e9}
.logo small{display:block;color:var(--navMuted);font-size:12px;margin-top:8px;padding-left:4px}
.signlogo{display:block;width:min(300px,80%);height:auto;margin:0 auto 6px;border-radius:12px}
.ngrp{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--navMuted);margin:14px 10px 4px}
.nitem{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;background:none;border:0;color:var(--navInk);padding:7px 10px;border-radius:7px;cursor:pointer;font-size:14px}
.nitem:hover{background:var(--navHover)}.nitem.on{background:var(--sun);color:var(--onSun);font-weight:600}
.nitem .cnt{background:var(--bad);color:#fff;border-radius:10px;font-size:11px;padding:0 6px;min-width:18px;text-align:center}
main{min-width:0}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-end;padding-block:10px;padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px));flex-wrap:wrap}
header.top .menu{display:none}
.tsel{display:flex;flex-direction:column;font-size:11px;color:var(--ink3);min-width:0}
.tsel select{font-size:14px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);min-width:150px;max-width:100%}
.shiftpill{margin-left:auto;background:var(--brandSoft);color:var(--brand);border-radius:20px;padding:5px 12px;font-size:13px;font-weight:600}
.syncpill{font-size:12px;color:var(--ink3);display:flex;align-items:center;gap:6px}
.syncpill i{width:8px;height:8px;border-radius:50%;background:var(--ink3);display:inline-block}
.syncpill.live i{background:var(--ok)}.syncpill.warn i{background:var(--warn)}
.wrap{padding-block:20px 60px;padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px));max-width:1280px}
h1{font-size:22px;margin:0 0 2px;text-wrap:balance}
.sub{color:var(--ink2);margin:0 0 16px;font-size:14px;max-width:78ch}
.sopref{display:inline-block;font-size:11px;background:var(--brandSoft);color:var(--brand);padding:1px 8px;border-radius:10px;margin-left:6px;vertical-align:middle;font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px;min-width:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{padding:12px 14px}.kpi .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}.kpi .l{font-size:12px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:14px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.btn:hover{border-color:var(--brand2)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--onBrand)}.btn.pri:hover{background:var(--brand2)}
.btn.acc{background:var(--accent);border-color:var(--accent);color:var(--onBrand)}
.btn.danger{color:var(--bad)}.btn.dangerfill{background:var(--bad);border-color:var(--bad);color:#fff}.btn.sm{padding:4px 9px;font-size:13px}
.btn.ghost{background:transparent;border-color:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
input.search{flex:1;min-width:160px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:4px 11px;font-size:13px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--onBrand)}
.tblwrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{background:var(--panel2);text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink2);padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
td{padding:8px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
tr.click{cursor:pointer}tr.click:hover td{background:var(--panel2)}
td.clip{max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:28px;text-align:center;color:var(--ink3)}
.pill{display:inline-block;border-radius:12px;padding:1px 9px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--line2);color:var(--ink2)}
.p-ok{background:var(--okSoft);color:var(--ok)}.p-warn{background:var(--warnSoft);color:var(--warn)}.p-bad{background:var(--badSoft);color:var(--bad)}
.p-info{background:var(--infoSoft);color:var(--info)}.p-purple{background:var(--purpleSoft);color:var(--purple)}.p-pink{background:var(--pinkSoft);color:var(--pink)}
.p-acc{background:var(--accentSoft);color:var(--accent)}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;justify-content:flex-end}
.drawer{background:var(--bg);width:min(720px,100%);height:100%;display:flex;flex-direction:column;box-shadow:-10px 0 30px rgba(0,0,0,.25);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dhead{padding:14px 20px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.dhead h2{font-size:18px;margin:0;flex:1}
.dbody{padding:16px 20px;overflow:auto;flex:1}
.dfoot{padding:12px 20px;background:var(--panel);border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.dfoot .sp{flex:1}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label{font-size:13px;font-weight:600;color:var(--ink2)}
.fld label .req{color:var(--bad)}
.fld .hint{font-size:12px;color:var(--ink3)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:var(--panel);width:100%}
.fld textarea{min-height:84px;resize:vertical}
.fld.err input,.fld.err select,.fld.err textarea,.fld.err .seg,.fld.err .chips{outline:2px solid var(--bad);outline-offset:1px;border-radius:8px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 11px;cursor:pointer;font-size:13px}
.seg button.on{background:var(--brand);border-color:var(--brand);color:var(--onBrand)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{font-weight:400;font-size:13px;border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:4px 10px;cursor:pointer;color:var(--ink)}
.chips label.on{background:var(--accentSoft);border-color:var(--accent);color:var(--accent)}
.chips input{position:absolute;opacity:0;pointer-events:none}
.secth{grid-column:1/-1;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--brand);border-bottom:1px solid var(--line);padding-bottom:4px;margin-top:8px;font-weight:700}
.infob{grid-column:1/-1;background:var(--infoSoft);color:var(--infoInk);border-radius:8px;padding:9px 12px;font-size:13px}
.infob.warn{background:var(--warnSoft);color:var(--warnInk)}
.ynt{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.ynt td{padding:5px 8px}.ynt .seg{flex-wrap:nowrap;gap:4px}.ynt .seg button{padding:3px 9px}
.ynt .desc{display:block;font-size:12px;color:var(--ink3);margin-top:2px}
.ynt .seg button.on[data-v="P"]{background:var(--ok);border-color:var(--ok);color:#fff}
.ynt .seg button.on[data-v="FU"]{background:var(--warn);border-color:var(--warn);color:#fff}
.ynt .seg button.on[data-v="U"]{background:var(--bad);border-color:var(--bad);color:#fff}
.ynt input{border:1px solid var(--line2);border-radius:6px;padding:4px 6px;width:100%;background:var(--panel)}
.meta{font-size:12px;color:var(--ink3);margin-top:14px}
.task{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line2)}
.task:last-child{border-bottom:0}
.task .tm{font-size:12px;color:var(--ink3);width:110px;flex:none;padding-top:2px}
.task .tt{flex:1;min-width:0;background:none;border:0;text-align:left;padding:0;cursor:pointer}.task .tt b{display:block;font-size:14px}.task .tt span{font-size:13px;color:var(--ink2)}
.task .st{flex:none}
.tick{width:22px;height:22px;accent-color:var(--ok)}
.alert{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;margin-bottom:6px;font-size:14px;cursor:pointer;border:0;width:100%;text-align:left;color:var(--ink)}
.alert.bad{background:var(--badSoft)}.alert.warn{background:var(--warnSoft)}.alert.info{background:var(--infoSoft)}
.alert .dot{width:8px;height:8px;border-radius:50%;flex:none}
.alert.bad .dot{background:var(--bad)}.alert.warn .dot{background:var(--warn)}.alert.info .dot{background:var(--info)}
.qa{display:flex;flex-wrap:wrap;gap:8px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.rtile{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:9px 10px;cursor:pointer;text-align:left;min-height:74px;min-width:0}
.rtile b{display:block;font-size:13px}.rtile small{display:block;color:var(--ink3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rtile .pill{margin-top:5px}
.rtile.Pass,.rtile.Exempt{border-color:var(--ok);background:var(--okSoft)}.rtile.Fail,.rtile.Follow-up{border-color:var(--warn);background:var(--warnSoft)}
.rtile.Day-Off{border-color:var(--purple);background:var(--purpleSoft)}.rtile.Due{border-color:var(--pink);background:var(--pinkSoft)}
.inv input,.inv select{border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:var(--panel)}
.inv input[type=number]{width:64px;text-align:right}
.catrow td{background:var(--panel2);font-weight:700;color:var(--brand)}
.ref h3{margin:0 0 6px;font-size:16px}.ref ol,.ref ul{margin:6px 0 0 18px;padding:0}.ref li{margin:3px 0}.ref p{margin:6px 0}
.ref .tag{font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px;margin-left:6px}
.t-yellow{background:color-mix(in srgb,#f6c90e 30%,transparent);color:var(--ink)}.t-red{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}.t-brown{background:var(--brandSoft);color:var(--brand)}.t-white{background:var(--line2);color:var(--ink2)}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--nav);color:var(--navInk);padding:9px 16px;border-radius:9px;z-index:60;font-size:14px;box-shadow:var(--sh);max-width:calc(100% - 32px)}
.toast.err{background:var(--badSoft);color:var(--bad);border:1px solid var(--bad)}
.banner{background:var(--warnSoft);color:var(--warnInk);padding-block:8px;padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px));font-size:13px;border-bottom:1px solid var(--line)}
.dlg{position:fixed;inset:0;background:var(--scrim);z-index:50;display:grid;place-items:center;padding:16px}
.dlg .box{background:var(--panel);border-radius:12px;max-width:460px;width:100%;padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.dlg h3{margin:0 0 6px;font-size:17px}.dlg p{margin:0 0 12px;color:var(--ink2);white-space:pre-line}
.dlg .fld{margin-bottom:10px}
.dlg .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  nav.side{position:fixed;left:0;top:0;bottom:0;width:250px;z-index:30;transform:translateX(-100%);transition:transform .2s;padding-top:calc(14px + env(safe-area-inset-top,0px))}
  nav.side.open{transform:none}
  header.top .menu{display:inline-flex}
  header.top{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g2{grid-template-columns:minmax(0,1fr)}
  .fgrid{grid-template-columns:minmax(0,1fr)}
  .shiftpill{margin-left:0}
  .tsel select{min-width:0;width:100%}
}
@media (max-width:520px){.task .tm{width:78px}.tsel{flex:1 1 140px}}
@media (prefers-reduced-motion:reduce){nav.side{transition:none}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<div class="app">
  <nav class="side" id="side" aria-label="Sections"></nav>
  <main>
    <div id="banner"></div>
    <header class="top">
      <button class="btn sm menu" id="menuBtn" type="button">☰ Menu</button>
      <div class="tsel"><label for="siteSel">Site</label><select id="siteSel"></select></div>
      <div class="tsel"><label for="on1">On shift (2 staff)</label><div class="pair"><select id="on1" aria-label="First staff member on shift"></select><select id="on2" aria-label="Second staff member on shift"></select></div></div>
      <div class="tsel"><label for="meSel">Logging as</label><select id="meSel"></select></div>
      <span class="shiftpill" id="shiftPill"></span>
      <span class="syncpill" id="sync"><i></i><span>Connecting…</span></span>
      <span class="pill" id="rolePill" hidden></span>
    </header>
    <div class="wrap" id="view"><p class="meta">Loading site records…</p></div>
  </main>
</div>

<script>

function noticeEffect(n,pillar,asOf){

  if(n.status!=='Resolved')return {s:n.level,why:n.deadline?`deadline ${fmtDate(n.deadline)}`:''};

  let lv=n.level,from=n.resolvedDate||n.date;const straight=site().probation==='straight';
  while(lv!=='Green'){const d=PROB_DAYS[lv];const until=addDays(from,d);if(asOf<until)return {s:lv,next:until,to:straight?'Green':STEP_DOWN[lv]};
    if(straight)return {s:'Green'};lv=STEP_DOWN[lv];from=until}
  return {s:'Green'}}

  return best}

const fieldsOf=m=>M[m].fields.filter(f=>f.k&&f.t!=='info');

/* Unit Room Check: which items were rated FU or U, the status they imply, and whether it needs follow-up. */
const ROOM_TABLES=['general','sleeping','appliances','plumbing','cords','exitPath'];
function roomFlags(r){const out=[];for(const k of ROOM_TABLES)for(const [item,x] of Object.entries(r[k]||{}))if(x&&(x.v==='FU'||x.v==='U'))out.push({table:k,item,v:x.v,n:x.n||''});return out}
function roomAutoStatus(r){const f=roomFlags(r);if(f.some(x=>x.v==='U')||r.smokeResult==='Fail')return 'Urgent';
  if(f.length||r.unapproved==='Found'||r.panelOk==='No'||r.smokeResult==='Low Bat.'||r.bedding==='Yes')return 'Needs Follow-Up';return 'All Clear'}
const roomFollow=r=>!!r.roomStatus&&!['Clean','All Clear'].includes(r.roomStatus);
/* Participant Time In/Out: one record per unit per shift, holding that shift's Out/In events. */
const ioId=(k,d,s,u)=>`io-${k}-${d}-${s}-${u}`;
const ioTimes=ev=>(ev||[]).map(e=>`${e.t} ${e.time}`).join(', ');
function ioParse(s){return String(s||'').split(/[,;\n]+/).map(x=>x.trim()).filter(Boolean).map(x=>{const m=x.match(/^(out|in)\s*(\d{1,2}):?(\d{2})/i);return m?{t:m[1][0].toUpperCase()+m[1].slice(1).toLowerCase(),time:`${pad(+m[2])}:${m[3]}`}:null}).filter(Boolean)}
function ioLatest(k){const out={};for(const r of recs('inout'))if(r.site===k)for(const e of r.events||[]){const at=new Date(`${r.date}T${e.time}`);const p=out[r.unit];if(!p||at>=p.at)out[r.unit]={t:e.t,at,time:e.time,date:r.date}}return out}
function incLateHrs(r){if(!r.date||!r.createdAt)return 0;const ev=new Date(`${r.date}T${r.time||'00:00'}`);return (new Date(r.createdAt)-ev)/36e5}
function lateness(r){const h=incLateHrs(r);return h>12?pill(`Late · ${Math.round(h)}h`,'bad'):pill('On time','ok')}
function intakeAge(r){if(['Admitted','Closed'].includes(r.status))return'';const h=hoursSince(r.createdAt||r.date);if(r.status==='New Inquiry'&&h>24)return pill('>24h unreviewed','bad');if(h>48&&!r.lastContact)return pill('>48h no contact','warn');return pill(Math.max(0,Math.round(h))+'h','')}

/* =========================================================
   IN-PAGE DIALOG (the viewer blocks alert/confirm/prompt)
   ========================================================= */
function ask({title,body='',ok='OK',cancel='Cancel',danger=false,fields=[]}){
  return new Promise(res=>{
    const d=document.createElement('div');d.className='dlg';d.setAttribute('role','dialog');d.setAttribute('aria-modal','true');
    d.innerHTML=`<div class="box"><h3>${esc(title)}</h3>${body?`<p>${body}</p>`:''}${fields.map((f,i)=>`<div class="fld"><label for="dq${i}">${esc(f.l)}</label>${f.o?`<select id="dq${i}">${f.o.map(o=>`<option ${o===f.v?'selected':''}>${esc(o)}</option>`).join('')}</select>`:`<input id="dq${i}" type="${f.t||'text'}" value="${esc(f.v??'')}">`}</div>`).join('')}
      <div class="acts">${cancel?`<button class="btn" data-a="no" type="button">${esc(cancel)}</button>`:''}<button class="btn ${danger?'dangerfill':'pri'}" data-a="ok" type="button">${esc(ok)}</button></div></div>`;
    const done=v=>{d.remove();res(v)};
    d.onclick=e=>{const a=e.target.dataset.a;if(a==='no'||e.target===d)done(null);if(a==='ok'){const vals=fields.map((f,i)=>$('#dq'+i,d).value);if(fields.some((f,i)=>f.req&&!vals[i].trim())){toast('Please fill in '+fields.find((f,i)=>f.req&&!vals[i].trim()).l,'err');return}done(fields.length?vals:true)}};
    d.onkeydown=e=>{if(e.key==='Escape'){e.stopPropagation();done(null)}if(e.key==='Enter'&&e.target.tagName==='INPUT')$('[data-a=ok]',d).click()};
    document.body.appendChild(d);($('input,select',d)||$('[data-a=ok]',d)).focus()})}

const isEmpty=v=>v==null||v===''||(Array.isArray(v)&&!v.length);
async function saveForm(){
  if(saving||!draft)return;const mod=M[draftMod];const bad=[];
  $('#fgrid').querySelectorAll('.fld.err').forEach(x=>x.classList.remove('err'));
  mod.fields.forEach((f,i)=>{if(!f.k)return;const vis=!f.show||f.show(draft);const req=typeof f.req==='function'?f.req(draft):f.req;
    if(vis&&req&&isEmpty(draft[f.k])){bad.push(f.l);$(`#fgrid [data-i="${i}"]`).classList.add('err')}});
  if(bad.length){toast('Please complete: '+bad.join(', '),'err');$('#fgrid .fld.err')?.scrollIntoView({block:'center'});return}
  const m=draftMod,d=draft,isNew=draftIsNew;
  // Writing check from the 12N Note Taking and Report Writing Guideline: observations, not guesses or labels.
  const txt=m==='notes'?d.notes:m==='incidents'?d.description:'';
  if(txt){const hits=[...new Set((String(txt).match(SUBJECTIVE_RE)||[]).map(w=>w.toLowerCase()))];
    const tooLong=m==='notes'&&NOTE_IR_TYPES.includes(d.type)&&String(txt).length>400;
    if(hits.length||tooLong){const parts=[];
      if(hits.length){const tips=[...new Set(hits.map(h=>(PERSON_FIRST.find(([re])=>re.test(h))||[])[1]).filter(Boolean))];
        parts.push(`These words can read as a label, judgement or diagnosis: “${hits.slice(0,6).join('”, “')}”. Use respectful, person-first language and describe what you saw or heard (e.g. “Participant declined room cleaning assistance” rather than “uncooperative”).${tips.length?'\n\nTry: '+tips.join(' · '):''}`)}
      if(tooLong)parts.push('This looks like a full incident account. Keep the shift log to a brief reference and put the details in the Incident Report.');
      if(!await ask({title:'Check the wording',body:parts.join('\n\n'),ok:'Save anyway',cancel:'Edit entry'}))return}}
  if(m==='engagement'&&d.category==='Daily Whiteboard'&&d.quote){const norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
    const rep=recs('engagement').find(r=>r.id!==d.id&&r.category==='Daily Whiteboard'&&norm(r.quote)===norm(d.quote)&&Math.abs((new Date(d.date)-new Date(r.date))/864e5)<60);
    if(rep&&!await ask({title:'Quote used recently',body:`This quote was posted on ${fmtDate(rep.date)}, less than 60 days ago.`,ok:'Save anyway'}))return}
  if(m==='guestunit'){const s=toMin(d.start),e=toMin(d.end);
    if(s<480||s>1080){toast('Bookings start between 8:00 AM and 6:00 PM.','err');return}
    if(e<=s||e>1200){toast('The end time must be after the start and no later than 8:00 PM.','err');return}
    if(e-s>120){toast('Guest Unit bookings are 2 hours at most.','err');return}

function invCalc(i){const total=(+i.office||0)+(+i.bath||0)+(+i.guest||0);const par=+i.par||0;
  const asset=i.type==='Persistent';const status=par===0?'On demand':total===0?'Out of Stock':total<=par?'Low Stock':'In Stock';
  const cond=i.cond==='Fair'?'Good':i.cond==='Maintenance'?'Needs Repair':(i.cond||'Good');const op=i.opStatus||(cond==='Needs Repair'?'Needs Maintenance':cond==='Missing'?'Required':'Operational');
  const order=par>total?par-total:0;return {...i,total,status,order,cond,opStatus:op,cost:order*(+i.price||0),maint:asset&&op!=='Operational'}}
const money=n=>'$'+(Math.round((+n||0)*100)/100).toFixed(2);

    const b=$('#loadStd');if(b)b.onclick=async()=>{b.disabled=true;b.textContent='Loading…';try{for(const s of SEED_INV)await putInv(k,seedInvItem(s));toast('Standard list loaded')}catch(e){writeErr(e);b.disabled=false}};return}
  const cons=calc.filter(i=>i.type!=='Persistent');const low=cons.filter(i=>i.status==='Low Stock').length,out=cons.filter(i=>i.status==='Out of Stock').length;
  const due=cons.filter(i=>i.order>0),cost=due.reduce((s,i)=>s+i.cost,0),maint=calc.filter(i=>i.maint).length,od=calc.filter(i=>i.status==='On demand').length;

    h+=`<tr><td><b style="font-weight:600">${esc(i.item)}</b>${CAN_WRITE?` <button type="button" class="btn sm ghost" data-edit="${esc(i.id)}" aria-label="Edit details of ${esc(i.item)}" style="padding:0 6px">✎</button>`:''}<div class="meta" style="margin:0">${esc(i.id)} · ${esc(i.type)}${i.model?' · '+esc(i.model):''}${asset&&i.assetLoc?' · '+esc(i.assetLoc):''}${asset&&i.assetValue?' · value '+money(i.assetValue):''}</div>${i.details?`<div class="meta" style="margin:0">${esc(i.details)}</div>`:''}
      ${invGuide?`<input ${ro} data-inv="${esc(i.id)}" data-f="storage" value="${esc(i.storage||'')}" placeholder="Where is it kept? Where is surplus stored?" aria-label="Storage location for ${esc(i.item)}" style="width:100%;min-width:200px;margin-top:4px">`:''}</td>
     <td>${esc(i.freq)}</td><td>${n('office')}</td><td>${n('bath')}</td><td>${n('guest')}</td><td><b>${i.total}</b></td><td><input type="number" ${ro} min="0" value="${esc(i.par)}" data-inv="${esc(i.id)}" data-f="par" aria-label="Par level for ${esc(i.item)}" style="width:52px"></td>

     <td><input type="number" ${ro} min="0" step="0.01" value="${esc(i.price??'')}" data-inv="${esc(i.id)}" data-f="price" aria-label="Unit price for ${esc(i.item)}" style="width:72px"></td>
     <td style="white-space:nowrap">${sel('cond',ASSET_COND,i.cond,'Condition')}${asset?' '+sel('opStatus',ASSET_STATUS,i.opStatus,'Status')+' '+sel('assetLoc',['',...ASSET_LOCS],i.assetLoc||'','Location'):''}</td>
     <td>${CAN_ADMIN?`<button class="btn sm ghost danger" type="button" data-rm="${esc(i.id)}" aria-label="Remove ${esc(i.item)}">✕</button>`:''}</td></tr>`}
  v.innerHTML=h+`</tbody></table></div>`;
  $('#invFilt').onchange=e=>{invFilter=e.target.value;render()};$('#invCsv').onclick=exportInvCSV;$('#audit').onclick=markAudit;$('#addInv').onclick=addInvItem;$('#toReq').onclick=restockToReq;$('#draftMail').onclick=draftRestockEmail;
  $('#invGuide').onchange=e=>{invGuide=e.target.checked;try{localStorage.setItem('nh_invGuide',invGuide?'1':'0')}catch(x){}render()};
  v.querySelectorAll('[data-kf]').forEach(b=>b.onclick=()=>{invFilter=b.dataset.kf;render()});
  v.querySelectorAll('[data-edit]').forEach(b=>b.onclick=async()=>{const it=items.find(x=>x.id===b.dataset.edit);
    const a=await ask({title:`Edit ${it.item}`,ok:'Save',fields:[{l:'Item name',v:it.item,req:1},{l:'Model / brand',v:it.model||''},{l:'Category',o:INV_CATS.includes(it.cat)?INV_CATS:[it.cat,...INV_CATS],v:it.cat},{l:'Type',o:['Consumable','Persistent'],v:it.type},

async function draftRestockEmail(){const k=curSite(),s=site();const calc=(INV[k]||[]).map(invCalc).filter(i=>i.type!=='Persistent');
  const line=i=>`- ${i.item}: order ${i.order} (have ${i.total}, par ${i.par})${i.price?` · ${money(i.price)} each, ${money(i.cost)}`:''}`;
  const crit=calc.filter(i=>i.status==='Out of Stock'),rec=calc.filter(i=>i.status==='Low Stock'),od=calc.filter(i=>i.status==='On demand').length;
  const tot=[...crit,...rec].reduce((a,i)=>a+i.cost,0);
  const subject=`${s.name} Inventory Check - Weekly Restock List (${fmtDate(today())})`;
  const body=[`Hello,`,``,`Here is this week's restock list for ${s.name}.`,``,`CRITICAL / WHAT WE NEED (out of stock)`,...(crit.length?crit.map(line):['- Nothing out of stock']),``,
    `RECOMMENDED / WHAT WE COULD USE (low stock)`,...(rec.length?rec.map(line):['- Nothing low']),``,tot?`Estimated total: ${money(tot)}`:'',
    od?`${od} on-demand item${od>1?'s are':' is'} (par 0) left off this list to avoid unnecessary spending.`:'',``,`Thank you,`,`${s.name} team${me()?' ('+me()+')':''}`].filter((x,i,a)=>x!==''||a[i-1]!=='').join('\n');
  const to=s.restockEmail||'';
  const r=await ask({title:'Weekly restock email',ok:'Copy text',cancel:'Close',body:`<b>To:</b> ${to?esc(to):'<i>not set. Add it under Site Info &amp; Contacts.</i>'}<br><b>Subject:</b> ${esc(subject)}<textarea readonly style="width:100%;min-height:260px;margin-top:8px;font:13px/1.4 ui-monospace,monospace;border:1px solid var(--line);border-radius:8px;padding:8px">${esc(body)}</textarea>
    ${to?`<a class="btn sm" style="margin-top:8px;display:inline-block" href="mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}">Open in my email app</a>`:''}`});
  if(r)copyText(`Subject: ${subject}\n\n${body}`,'Restock email copied')}
async function addInvItem(){const a=await ask({title:'Add inventory item',ok:'Add item',fields:[{l:'Item name',req:1},{l:'Category',o:INV_CATS,v:'Office Supplies'},{l:'Type',o:['Consumable','Persistent'],v:'Consumable'},{l:'Replacement frequency',o:['Weekly','Bi-weekly','Monthly','Quarterly','As Needed','Annually'],v:'Monthly'},{l:'Par level (0 = on demand, never reordered)',t:'number',v:2},{l:'Unit price (optional)',t:'number',v:''},{l:'Storage location / surplus notes (optional)',v:''}]});

async function setUnit(no,patch,msg){const k=curSite();await cfgSave(()=>{const u=CFG.sites[k].units.find(x=>String(x.no)===String(no));Object.assign(u,patch)},msg)}
async function moveIn(no){const k=curSite();const free=vacantUnits();if(!free.length)return toast('There are no vacant units. Add units under Sites & Export, or move someone out first.','err');

/* =========================================================
   SCHEDULE (two staff per shift; managers and supervisors edit, everyone views once published)
   ========================================================= */
const weekStart=ds=>{const d=new Date(ds+'T12:00');return addDays(ds,-((d.getDay()+6)%7))};
const weekDays=w=>Array.from({length:7},(_,i)=>addDays(w,i));
const dayName=ds=>new Date(ds+'T12:00').toLocaleDateString(undefined,{weekday:'short'});
const schedWeek=(k,w)=>(SCHED[k]||[]).find(x=>x.id===w);
/* Scheduled pair for a date/shift (published weeks only, unless asked). */
/* What facilitators see: the approved copy. Weeks saved before approvals existed used days + published. */
const pubDays=w=>w?(w.publishedDays||(w.published&&!('publishedDays' in w)?w.days:null)):null;
function schedFor(k,ds,i,drafts){const w=schedWeek(k,weekStart(ds));const src=drafts?(w&&w.days):pubDays(w);if(!src)return [];return ((src[ds]||{})[i]||[]).filter(Boolean)}
const schedNow=()=>schedFor(curSite(),today(),shiftIdx());
function schedGaps(k,n){let g=0;for(let d=0;d<n;d++){const ds=addDays(today(),d);for(let i=0;i<3;i++){if(d===0&&i<shiftIdx()&&shiftIdx()!==2)continue;if(schedFor(k,ds,i,true).length<2)g++}}return g}
let SCHED_WEEK='';
function renderSchedule(v){
  const k=curSite();if(!SCHED_WEEK)SCHED_WEEK=weekStart(today());const wk=SCHED_WEEK;const days=weekDays(wk);
  const can=CAN_SCHEDULE&&CAN_WRITE&&site().status!=='Archived';const doc=schedWeek(k,wk);
  const w=doc?clone(doc):{id:wk,week:wk,days:{},notes:''};const pub=pubDays(w);
  const view=can?(w.days||{}):(pub||{});const names=staffNames();const t0=today(),si=shiftIdx();
  const changed=!!pub&&JSON.stringify(pub)!==JSON.stringify(w.days||{});
  const status=!doc?pill('Not started',''):w.submitted?pill('Waiting for approval','warn'):pub?(changed&&can?pill('Published · draft has changes','warn'):pill('Published','ok')):pill('Draft','');
  const dayLoad={};days.forEach(ds=>{const c={};for(let i=0;i<3;i++)((view[ds]||{})[i]||[]).filter(Boolean).forEach(n=>c[n]=(c[n]||0)+1);dayLoad[ds]=c});
  const sel=(ds,i,j)=>{const cur=(((view[ds]||{})[i])||[])[j]||'';const list=names.includes(cur)||!cur?names:[cur,...names];
    return `<select data-sd="${ds}" data-si="${i}" data-sj="${j}" aria-label="${dayName(ds)} ${ds} ${SHIFTS[i]} staff ${j+1}" style="width:100%;border:1px solid var(--line);border-radius:6px;padding:4px;background:var(--panel)"><option value="">—</option>${list.map(n=>`<option ${n===cur?'selected':''}>${esc(n)}</option>`).join('')}</select>`};
  const mine=me()?[0,1].flatMap(o=>weekDays(addDays(weekStart(t0),7*o))).filter(ds=>ds>=t0).flatMap(ds=>[0,1,2].filter(i=>schedFor(k,ds,i).includes(me())&&!(ds===t0&&i<si&&si!==2)).map(i=>`${dayName(ds)} ${fmtDate(ds)} · ${SHIFTS[i]}`)):[];
  const intro=!can?'This is the approved schedule. Talk to your supervisor about changes.'
    :CAN_PUBLISH?'Build the week, then approve and publish it. Facilitators only see what you publish.'
    :'Build the week as a draft, then submit it. A manager approves and publishes it before facilitators see it.';
  v.innerHTML=`<h1>Schedule<span class="sopref">${esc(site().name)}</span></h1>
  <p class="sub">Two staff on every shift. ${intro}</p>
  <div class="toolbar"><button class="btn sm" type="button" id="wkPrev" aria-label="Previous week">◀</button><b>Week of ${esc(fmtDate(wk))}</b><button class="btn sm" type="button" id="wkNext" aria-label="Next week">▶</button>
   ${wk!==weekStart(t0)?'<button class="btn sm" type="button" id="wkNow">This week</button>':''}
   ${can?status:''}${can&&w.submitted&&w.submittedBy?`<span class="meta" style="margin:0">Submitted by ${esc(w.submittedBy)}</span>`:''}${can&&pub&&w.publishedBy?`<span class="meta" style="margin:0">Published by ${esc(w.publishedBy)}</span>`:''}
   <span style="flex:1"></span>${can?`<button class="btn sm" type="button" id="wkCopy">Copy previous week</button>`:''}
   ${can&&!CAN_PUBLISH&&!w.submitted?`<button class="btn sm pri" type="button" id="wkSubmit">Submit for approval</button>`:''}
   ${can&&!CAN_PUBLISH&&w.submitted?`<button class="btn sm" type="button" id="wkWithdraw">Withdraw submission</button>`:''}
   ${CAN_PUBLISH&&can?`<button class="btn sm pri" type="button" id="wkPub">${pub&&!changed&&!w.submitted?'Published':'Approve &amp; publish'}</button>${pub?'<button class="btn sm" type="button" id="wkUnpub">Unpublish</button>':''}`:''}</div>
  ${!can&&!pub?`<div class="card empty">The schedule for this week hasn't been published yet.</div>`:`
  <div class="tblwrap"><table style="min-width:760px"><thead><tr><th>Shift</th>${days.map(ds=>`<th style="${ds===t0?'background:var(--sun);color:var(--onSun)':''}">${dayName(ds)}<div style="font-weight:400;text-transform:none">${esc(fmtDate(ds).replace(/, \d{4}$/,''))}</div></th>`).join('')}</tr></thead><tbody>
   ${SHIFTS.map((sh,i)=>`<tr><td><b>${esc(sh.split(' ')[0])}</b><div class="meta" style="margin:0">${esc(sh.replace(/^\S+ /,''))}</div></td>${days.map(ds=>{const a=((view[ds]||{})[i]||[]).filter(Boolean);
     const dbl=a.filter(n=>dayLoad[ds][n]>1);const now=ds===t0&&i===si;
     return `<td style="min-width:110px;${now?'outline:2px solid var(--brand);outline-offset:-2px':''}">${can?sel(ds,i,0)+'<div style="height:4px"></div>'+sel(ds,i,1):(a.length?esc(a.join(' & ')):'<span class="meta" style="margin:0">—</span>')}
      ${can&&a.length<2?`<div style="margin-top:4px">${pill(a.length?'1 of 2':'Needs 2','warn')}</div>`:''}${can&&dbl.length?`<div style="margin-top:4px">${pill('2 shifts this day: '+dbl.join(', '),'warn')}</div>`:''}</td>`}).join('')}</tr>`).join('')}
  </tbody></table></div>`}
  <div class="grid g2" style="margin-top:16px;align-items:start">
   <div class="card"><b>My upcoming shifts</b>${me()?(mine.length?`<ul style="margin:8px 0 0 18px;padding:0">${mine.slice(0,10).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<p class="meta">No published shifts for you in the next two weeks.</p>'):'<p class="meta">Choose who is logging at the top to see your shifts.</p>'}</div>
   <div class="card"><b>Notes for this week</b>${can?`<textarea id="wkNotes" aria-label="Notes for this week" style="width:100%;min-height:90px;margin-top:8px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--panel)">${esc(w.notes||'')}</textarea>`:`<p style="white-space:pre-wrap">${esc(pub?(w.notes||'—'):'—')}</p>`}</div></div>`;
  const who=()=>me()||MY_UID||'';
  const save=async(mut,msg)=>{const d=clone(w);mut(d);d.updatedAt=new Date().toISOString();d.updatedBy=who();try{await putSub(k,'schedule',d);if(msg)toast(msg)}catch(e){writeErr(e);render()}};
  $('#wkPrev').onclick=()=>{SCHED_WEEK=addDays(wk,-7);render()};$('#wkNext').onclick=()=>{SCHED_WEEK=addDays(wk,7);render()};
  const wn=$('#wkNow');if(wn)wn.onclick=()=>{SCHED_WEEK=weekStart(t0);render()};
  v.querySelectorAll('[data-sd]').forEach(el=>el.onchange=()=>{const ds=el.dataset.sd,i=+el.dataset.si,j=+el.dataset.sj;
    const other=((((w.days||{})[ds]||{})[i])||[])[1-j];if(el.value&&el.value===other){toast('Pick two different people for this shift.','err');render();return}
    save(d=>{d.days=d.days||{};d.days[ds]=d.days[ds]||{};const a=(d.days[ds][i]||['','']).slice(0,2);while(a.length<2)a.push('');a[j]=el.value;d.days[ds][i]=a})});
  const wc=$('#wkCopy');if(wc)wc.onclick=async()=>{const prev=schedWeek(k,addDays(wk,-7));if(!prev)return toast('There is no schedule for the previous week.','err');
    if(doc&&Object.keys(doc.days||{}).length&&!await ask({title:'Replace this week\'s draft?',body:'This week already has shifts filled in. Copy the previous week over them?',ok:'Copy'}))return;
    save(d=>{d.days={};weekDays(prev.week).forEach((ds,n)=>{if((prev.days||{})[ds])d.days[addDays(wk,n)]=clone(prev.days[ds])})},'Copied the previous week into the draft')};
  const gaps=()=>days.reduce((g,ds)=>g+[0,1,2].filter(i=>(((w.days||{})[ds]||{})[i]||[]).filter(Boolean).length<2).length,0);
  const ws=$('#wkSubmit');if(ws)ws.onclick=async()=>{const g=gaps();if(g&&!await ask({title:'Submit with gaps?',body:`${g} shift${g>1?'s have':' has'} fewer than 2 staff.`,ok:'Submit anyway'}))return;
    save(d=>{d.submitted=true;d.submittedBy=who();d.submittedAt=new Date().toISOString()},'Sent to a manager for approval')};
  const ww=$('#wkWithdraw');if(ww)ww.onclick=()=>save(d=>{d.submitted=false},'Submission withdrawn');

    ['Office',['Desk organized, paperwork neat','Binder check: printables stocked','Office door locked or closed when unattended; participants don\'t enter the office']],
    ['Admin & safety',['Check staff email 3–4 times','Perimeter check with a flashlight where needed','Monitor cameras regularly (more often after dark)','Document participant notes promptly','Incident Reports completed if needed','Clear handover to overnight staff']]]};
const SHIFT_TASK_NAMES={0:'Morning shift (8 AM – 4 PM)',1:'Evening shift (4 PM – 12 AM)',2:'Overnight shift (12 AM – 8 AM)'};
let taskShift=null;
const initials=n=>String(n||'').split(/\s+/).filter(Boolean).map(w=>w[0].toUpperCase()).join('');
function shiftTaskList(s,ds){const d=dow(ds);return SHIFT_TASKS[s].map(([sec,items])=>[sec,items.filter(x=>!Array.isArray(x)||x[1]===d).map(x=>Array.isArray(x)?x[0]:x)])}
function taskProgress(s){const all=shiftTaskList(s,today()).flatMap(([sec,items])=>items.map(i=>sec+'|'+i));const done=all.filter(id=>CHECKS[`${s}_task:${id}`]).length;return {done,total:all.length,signed:CHECKS[`${s}_signoff`]}}
function renderTasks(v){const s=taskShift??shiftIdx();const ds=today();const list=shiftTaskList(s,ds);const pr=taskProgress(s);const so=pr.signed;
  v.innerHTML=`<h1>Shift Tasks<span class="sopref">NH Staff Shift + Task Lists</span></h1>
  <p class="sub">Tick each task as you complete it; your initials and the time are recorded. Review the list at shift change and sign off.</p>
  <div class="toolbar">${[0,1,2].map(i=>`<button type="button" class="chip ${i===s?'on':''}" data-ts="${i}">${esc(SHIFT_TASK_NAMES[i])}${i===shiftIdx()?' · now':''}</button>`).join('')}<span style="flex:1"></span>${pill(`${pr.done} / ${pr.total} done`,pr.done===pr.total?'ok':'warn')}</div>
  <div class="grid g2" style="align-items:start">${list.map(([sec,items])=>`<div class="card"><b>${esc(sec)}</b><div style="margin-top:6px">${items.map(it=>{const key=`task:${sec}|${it}`;const c=CHECKS[`${s}_${key}`];
    return `<label style="display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-top:1px solid var(--line2)"><input type="checkbox" class="tick" data-task="${esc(key)}" ${c?'checked':''} ${CAN_WRITE&&!so?'':'disabled'} style="margin-top:3px"><span style="flex:1">${esc(it)}${c&&c.by?`<span class="meta" style="display:block;margin:0">✓ ${esc(initials(c.by))} · ${esc(c.at||'')}</span>`:''}</span></label>`}).join('')}</div></div>`).join('')}</div>
  <div class="card" style="margin-top:14px;max-width:620px"><b>End of shift sign-off</b>${so?`<p>Signed off by <b>${esc(so.by)}</b> at ${esc(so.at)}. Notes and communication confirmed.</p>${CAN_REVIEW?'<button class="btn sm" type="button" id="unsign">Reopen the list</button>':''}`:`
   <label style="display:flex;gap:8px;margin:8px 0"><input type="checkbox" id="commOk"> Notes and communication confirmed with the incoming staff</label>
   <button class="btn pri" type="button" id="signoff" ${CAN_WRITE?'':'disabled'}>Sign off this shift</button>`}</div>`;
  v.querySelectorAll('[data-ts]').forEach(b=>b.onclick=()=>{taskShift=+b.dataset.ts;render()});
  const save=async patch=>{CHECKS=Object.assign({},CHECKS,patch,{date:today(),site:curSite()});try{await putChecks()}catch(e){writeErr(e)}};
  v.querySelectorAll('[data-task]').forEach(c=>c.onchange=()=>{if(!me()){c.checked=!c.checked;return toast('Choose who is logging at the top first, so tasks are initialled.','err')}
    save({[`${s}_${c.dataset.task}`]:c.checked?{by:me(),at:nowTime()}:false})});
  const sb=$('#signoff');if(sb)sb.onclick=async()=>{if(!me())return toast('Choose who is logging at the top first.','err');if(!$('#commOk').checked)return toast('Confirm notes and communication with the incoming staff first.','err');
    const left=pr.total-pr.done;if(left&&!await ask({title:`${left} task${left>1?'s':''} not ticked`,body:'Sign off anyway? Pass anything unfinished to the incoming staff in the handoff.',ok:'Sign off'}))return;
    save({[`${s}_signoff`]:{by:me(),at:nowTime(),done:pr.done,total:pr.total}});toast('Shift signed off')};
  const us=$('#unsign');if(us)us.onclick=()=>save({[`${s}_signoff`]:false})}
function housingCards(C){const lp=lvPill;return `
  ${C('The colour system','Community 3.4 · Sunnyside 3.2','t-yellow',`<table>
   <tr><td>${lp('White')}</td><td>New resident (3 months or less), no concerns.</td></tr>
   <tr><td>${lp('Green')}</td><td>Good standing.</td></tr>
   <tr><td>${lp('Yellow')}</td><td>First or minor concern. <b>Notice of Policy Violation.</b> Back after 4 weeks with no new concerns.</td></tr>
   <tr><td>${lp('Orange')}</td><td>Repeated or more serious concern. <b>Urgent Notice.</b> 6 weeks.</td></tr>
   <tr><td>${lp('Red')}</td><td>Serious or unresolved concerns. <b>Second Urgent Notice.</b> 7 weeks.</td></tr>
   <tr><td>${lp('Gray')}</td><td>Formal Residential Tenancies Act stage.</td></tr></table>
   <p>Each policy area has its own colour; the overall status is the most serious one. The waiting period starts once the concern is fixed. Home Upkeep goes back to Green as soon as a follow-up inspection confirms it. Serious matters don't have to start at Yellow.</p>`)}
  ${C('Writing and serving a notice','Community 3.3 · 9.0.2','t-yellow',`<p><b>Start with a conversation and support</b>, and give a fair chance to fix it. Consider disability, trauma and other barriers.</p><p><b>Every notice includes:</b> date; resident's name and home; a clear, factual description; what they need to do; the deadline; who issued it; and the date, time and method of service.</p><p><b>Deadlines:</b> non-urgent matters get at least 7 days. Conduct matters (threats, harassment, violence, weapons, illegal activity, serious disturbance) need immediate compliance.</p><p><b>Serving:</b> by hand (preferred) or posted on the door, recorded at the time. <b>Never include</b> anything a resident shared in a support conversation without their consent.</p>`)}
  ${C('When a resident contests a notice','Community 3.5','t-yellow',`<ol><li>Ask for the appeal in writing, with their reasons. Log the date it was received.</li><li>Someone not involved in the original notice reviews it: the facts, whether the level was right, and the resident's information.</li><li>Answer in writing within <b>14 days</b>: upheld, modified or reversed, with reasons and any next steps.</li><li>If reversed, the dashboard updates right away (mark the notice “Reversed on appeal”).</li></ol>`)}
  ${C('Gray: the formal RTA stage','Community 3.6 · Sunnyside 3.5','t-yellow',`<p><b>Before Gray, confirm:</b> a complete written notice was served, its deadline has passed, the concern is unresolved, and the file is complete.</p><table><tr><td><b>Gray A</b></td><td>Application for Assistance to the Residential Tenancies Tribunal: noise, guests or occupancy, housekeeping, damage or modifications not fixed.</td></tr><tr><td><b>Gray B</b></td><td>Form 3 serious-case application: extensive damage, health or safety risk, illegal activity.</td></tr><tr><td><b>Gray C</b></td><td>Rent: Notice to Vacate, copy to the Tribunal within 7 days, then Final Notice to Vacate.</td></tr></table><p>Where a landlord partner owns the site, only they give legal (RTA) notices. 12N refers the concern with the file.</p>`)}
  ${C('Rent timeline','Community 4.2','t-yellow',`<table><tr><td><b>1st</b></td><td>Rent due. Confirm every payment (by the morning of the 2nd).</td></tr><tr><td><b>2nd</b></td><td>Not paid in full: Notice to Vacate (Gray). Try to reach the resident. Copy to the Tribunal <b>within 7 days</b>, even if they then pay.</td></tr><tr><td><b>2nd–8th</b></td><td>Paid in full: back to Green; the notice stays on file.</td></tr><tr><td><b>9th</b></td><td>Still unpaid: Final Notice to Vacate.</td></tr><tr><td><b>16th</b></td><td>Not vacated: eviction steps under the RTA.</td></tr></table><p>A pattern of late payment means a support conversation first (is the payment method working?), then the Community Manager.</p>`)}
  ${C('Home inspections','Community 4.3','t-yellow',`<p><b>How often:</b> every 6 months; yearly after two Green inspections in a row; follow-ups as set. Give <b>24 hours' written notice</b> and invite the resident to be there.</p><p><b>Look at:</b> cleanliness, exterior and deck, smoking inside, modifications, damage, prohibited items, pests or odour, smoke detectors and air exchanger, maintenance needs.</p><p><b>Results:</b> Green, no action · Yellow, notice and follow-up · Orange or Red, notice, an improvement plan made with the resident, and follow-up. Landlord repairs go to a work order. Photograph concerns.</p>`)}
  ${C('Home Stabilization Plan','Community 4.4.6 · Sunnyside 3.2','t-yellow',`<p>A written, time-limited plan when guests or occupancy are affecting a home's stability. It is not a penalty. A Community Manager approves it before it's issued, ideally in a meeting with the resident.</p><p><b>Includes:</b> what was observed, the steps the resident will take, the support offered, and a review date (usually 7–21 days).</p><p><b>Temporary measures can include:</b> limiting overnight guests, guests accompanied on the property, resetting guest codes, naming people who can't enter, removing non-residents' belongings, help securing the home, more check-ins. Consider accommodation for disability or support needs.</p>`)}
  ${C('Parking','Community 4.6','t-yellow',`<ol><li>Document the location, vehicle, plate and concern, with photos. Identify the owner.</li><li><b>First notice</b> on the vehicle and to the resident: <b>7 days</b> to move it, repair it or contact the office.</li><li><b>Second notice:</b> <b>72 hours</b>. Re-photograph the vehicle and contact the resident directly.</li><li><b>Management review</b> before any removal: steps followed, local bylaws checked, licensed towing.</li></ol>`)}
  ${C('Pets','Community 4.7','t-yellow',`<p>No pet comes on the property without written approval first. Collect a photo; the pet's name, type and age; the veterinarian's details; vaccination records; and the signed Pet Agreement (Form D). Pet concerns follow the usual notice levels, and approval can be withdrawn.</p>`)}
  ${C('Visitor bans','Sunnyside 3.6','t-yellow',`<ol><li>Ask the person to leave. Call police if they refuse or there's a threat. Write an Incident Report.</li><li>A Site Supervisor or above decides on a ban (overnight: leadership on-call).</li><li>Give the written Notice of Trespass in person (two staff) or with police: 6 months standard, permanent for violence.</li><li>Tell the resident host and offer support, especially if they were under pressure.</li><li>Add the person to the <a href="#trespass">No-Trespass List</a>, cancel linked guest codes, and tell the landlord partner.</li></ol><p>A ban never applies to a resident.</p>`)}
  ${C('When a resident can\'t be reached','Sunnyside 7.8','t-yellow',`<p>Residents come and go as they please. Being away is never a concern in itself.</p><p><b>Start right away</b> if there's information they may be in danger. <b>After 24 hours</b> without contact for someone at higher risk (recent overdose or crisis, serious health concern, talk of self-harm). Otherwise there's no timer.</p><p>Check the logs, call or text, knock and identify yourself (don't go in), and ask colleagues discreetly. Then write an Incident Report, phone the Site Supervisor, contact agencies they've consented to, and request a police wellness check.</p><p><b>When they're found safe:</b> welcome them back without questions about where they were, and offer a check-in.</p>`)}
  ${C('Emergency entry to a home','Sunnyside 7.9','t-yellow',`<p><b>Only</b> when a life or safety is at serious risk right now, or serious damage is happening. For fire or a gas smell, don't go in.</p><ol><li>Call 911 if needed. Phone the supervisor only if it won't delay help.</li><li>Knock and say who you are. Wait seconds, not minutes.</li><li>Two staff where possible. Do only what the emergency needs; no searching.</li><li>Lock up afterwards, or stay until it's secured.</li><li>Complete the <a href="#entries">Emergency Entry Record</a> and an Incident Report this shift. Tell the resident what happened and why, and offer support.</li></ol>`)}
`}
function renderSOP(v){const C=(title,tag,tagc,body)=>`<div class="card ref"><h3>${title}<span class="tag ${tagc}">${tag}</span></h3>${body}</div>`;
  v.innerHTML=`<h1>SOP Quick Reference</h1><p class="sub">Summaries of the SOPs used most on shift. The binders are the official source: Brown (NH), Red (Safety), White (All-Employees Handbook), Yellow (Community), Green (G&amp;A), Blue (Neighbourly Ventures), Pink (Neighbourly Coffee), plus the Inventory SOP and Guest Unit Policy.</p>
  <div class="grid g2">
  ${isHousing()?housingCards(C):''}
  ${C('Emergency procedures','NH 3.1.7','t-brown',`<ol><li>Stay calm. Call <b>911</b> for imminent danger, a medical need or a crime.</li><li>Notify another staff member right away. Never respond alone if it feels unsafe.</li><li>Clear the area if needed. Give CPR or Naloxone as needed.</li><li>Give emergency services a clear, calm summary.</li><li>Afterwards: Incident Report within 12 h, debrief with the Site Supervisor, offer staff support, notify agency partners if hospitalised.</li></ol><p><b>Fire:</b> pull the alarm, evacuate to the meeting point, and don't re-enter until cleared.</p>`)}
  ${C('Shift notes: what to log','12N Note Taking Guideline','t-brown',`<p>Participants have privacy and freedom of movement in their daily lives. Write down what staff need to know to support a participant, respond to a concern, or carry work into the next shift.</p><p><b>Ask:</b> would this change what staff need to know or do?</p><p><b>Log:</b> meaningful wellness changes, missed scheduled check-ins, requests or commitments that need follow-up, safety concerns, site issues such as a leak or a supply shortage, and completed work that matters to the next shift.</p><p><b>Leave out:</b> routine comings and goings, trips off site, vehicle movements, greetings, casual conversation, and minor disagreements resolved in the moment.</p><p><b>Each entry:</b> date and time, what happened, what staff did, and the outcome. Briefly note completed work that matters to the next shift. Use the location and approved participant identifier when needed.</p><p><b>Write what you observed:</b> for example, “Participant declined room cleaning assistance.” Attribute second-hand information to its source. Quote exact words only when they matter to the response. Leave out guesses, diagnoses and unrelated personal details.</p><p><b>Follow-up:</b> flag it, and say who will act, what they need to do, and when. Share notes only through approved channels, with staff who need the information.</p><p><b>Incidents:</b> escalate urgent concerns first, then file the Incident Report within the deadline: the sequence of events, what you observed, actions taken, and who was notified. In the shift log, briefly reference it and note what the incoming team needs to do.</p><p><b>Handoff:</b> review pending actions with incoming staff and confirm who is taking each item.</p><p class="meta" style="margin:0"><i>Example:</i> At 2:15 p.m., the participant in Unit 08 reported water pooling under the sink. Staff submitted a work order. Evening shift to check the repair status by 6 p.m. and update the participant.</p><p class="meta" style="margin:4px 0 0"><i>Handoff example:</i> Incident Report filed for a fall near the main entrance. The entrance mat was removed. Incoming shift to confirm a replacement with Maintenance before reopening that entrance.</p>`)}
  ${C('Incident reporting','NH 3.1.4','t-brown',`<p><b>When:</b> injury, illness, property damage, near miss, behavioural escalation, harassment, violence, Code of Conduct breach, police/EMS on site, or any other event that needs follow-up.</p><p><b>Deadline:</b> within <b>12 hours</b>. Finish it before you leave, or hand it off.</p><p><b>Include:</b> initials or ID codes only, staff or participant for each person, date, time, location, an objective sequence of events, actions taken, and whether the Supervisor or On-Call was contacted.</p><p><b>Leave out:</b> opinions, assumptions, diagnoses, hearsay (or name who told you), blame.</p><p>Message the Site Supervisor or Manager on Signal for urgent incidents.</p>`)}
  ${C('Behaviour Escalation Framework','NH 3.1.12 · Resident Escalation','t-brown',`<ol><li><b>Incident Report</b>: any staff member.</li><li><b>Room Status Update</b> (Tier 1–3, Room Reset checklist): Safety &amp; Operations Lead. Runs alongside for cleanliness.</li><li><b>Written Warning</b> (first / second / final): any staff member, when reviewing behaviour in incident reports.</li><li><b>Community Accountability Review (CAR) &amp; Agreement</b>: S&amp;O Lead with the Site Manager; follow up in 1–2 weeks. There can be several.</li><li><b>Urgent Warning (Final Written Notice)</b>: Site Manager. The behaviour must stop immediately.</li><li><b>10-Day Final Improvement Notice</b>: mostly for room safety; at least Tier 2 within 10 days, with cleaning support and check-ins.</li><li><b>Eviction Request</b>: Site Manager, with all documents, for the NH Participant Program Review decision.</li><li><b>Debrief &amp; lessons learned</b>: NH Operations Review looks for gaps in our own support.</li></ol><p>Record each step under <a href="#escalations">Escalation Records</a>.</p><p><b>Red-line items</b> (violence, weapons, sexual assault) may go straight to step 6. <b>3 CARs in 12 months</b> trigger a mandatory Placement Review.</p>`)}
  ${C('Missing participant','NH 3.1.16','t-brown',`<p><b>Thresholds:</b> High Risk: <b>24 h</b> without confirmed contact. Non-High Risk: <b>10 days</b>. Reassess at any time.</p><p><b>Before the threshold:</b> check logs, call or text the participant, ask discreetly, and document every attempt.</p><ol><li>Facilitator: Incident Report (unit, risk level, last seen, attempts, description)</li><li>Facilitator: phone the Site Manager</li><li>Manager: partner agencies by phone, plus email within 2 h (cc Director and Safety &amp; Ops Lead)</li><li>Manager: police missing person report. Record the occurrence #</li><li>Manager: email the Safety &amp; Ops Lead and Director the same day</li></ol><p>Keep the unit secured and belongings preserved.</p>`)}
  ${C('Law enforcement arrival','NH 3.1.11','t-brown',`<ol><li>Greet them, introduce yourself, and ask for a business card and the purpose of the visit.</li><li>Warrant: ask for a copy, check the name and DOB, check it is signed by a judge, and write the warrant # on the card.</li><li>Ask the officers to wait in the office.</li><li>Tell the participant privately and let them gather belongings.</li><li>Walk them to the office.</li><li>Log it in Shift Notes and file an Incident Report with photos of the warrant and card. Notify the Supervisor or Manager.</li></ol>`)}
  ${C('Visitor disruption & trespass','Guide 2.7.3','t-white',`<p>Assess, approach calmly, explain expectations, and offer a quiet space. Never approach someone showing aggression on your own, and never make physical contact.</p><p><b>Level 1</b> verbal feedback → <b>Level 2</b> asked to leave → <b>Level 3</b> Notice of Trespass (needs Executive Director approval).</p><p>Violence or weapons: disengage, retreat and call <b>911</b>. If someone won't leave after a trespass notice: police non-emergency <b>${esc(site().nonEmergency||'—')}</b>.</p>`)}
  ${C('Work order severity','NH 3.3.10','t-brown',`<table><tr><td>${pill('1 — Critical')}</td><td>Gas leak, flooding, structural failure, no heat in winter, fire safety down. <b>Escalate immediately</b> by phone or Signal.</td></tr><tr><td>${pill('2 — Urgent')}</td><td>Plumbing failure, no hot water, broken lock. Submit the same day. Assigned within 24 h.</td></tr><tr><td>${pill('3 — Routine')}</td><td>Appliance issue or minor repair. Next Wednesday site visit.</td></tr><tr><td>${pill('4 — Low')}</td><td>Cosmetic. Batched with scheduled work.</td></tr></table><p>Only C&amp;M staff do repairs. No work order closes without a completion note.</p>`)}
  ${C('Participant privacy','Guide 2.7.2','t-white',`<p>Protect names, room numbers, contact info, DOB, health and history. Share only on a need-to-know basis.</p><p><b>Inquiry script:</b> <i>“I appreciate your concern, but I cannot disclose personal details due to confidentiality policies.”</i> Offer to connect them with the Community team. Never confirm or deny that someone lives here.</p><p><b>Exception:</b> imminent harm or a medical emergency. Share only the minimum with first responders, then brief the Shift Lead and log it.</p>`)}
  ${C('Professional boundaries','Guide 2.5.3','t-white',`<p>These apply 24/7, on and off site. <b>Do not</b>: give rides, lend or borrow money, give or receive gifts, socialise outside work, use personal social media or phone numbers, or make home visits.</p><p>Financial exploitation or romantic relationships lead to immediate termination.</p>`)}
  ${C('Unit room checks','NH 3.1.6 · Form v1.0','t-brown',`<p><b>At this site: ${esc(unitFreqText())}</b> (set under Site Info &amp; Contacts). The SOP's standard is every second Thursday, 2–4 PM, with notice posted 48 h ahead. Knock, wait, announce. Visual check only: trash, unsafe electrical items, odours or distress, cleanliness. No opening bins, drawers or bags without immediate risk <i>and</i> supervisor approval.</p><p>Use the official <b>Unit Room Check Form</b>: rate each item P (Pass), FU (Follow-Up) or U (Urgent). Overall status: All Clear / Needs Follow-Up / Urgent. Notify Management for anything urgent, unapproved appliances or electrical panel concerns. Test smoke detectors on the first Thursday of the month. Offer a private check-in within 48 h when follow-up is needed.</p>`)}
  ${C('Contacting your Site Manager','Staff Communication & Escalation Protocol','t-white',`${contactGuideHTML()}<p><b>Peer-to-peer first:</b> concerns about a coworker are raised with that coworker where it's safe. Safety, harassment or policy concerns go to the next 1:1 or team check-in, unless they are an emergency or urgent.</p><p><b>Documentation:</b> don't keep or share your own records about coworkers. Use approved channels: a 1:1, a coaching conversation or an HR submission. If you're unsure, ask your Site Manager or the Payroll &amp; Systems Administrator.</p>`)}
  ${C('Foodbank orders','Monthly Foodbank Order Form','t-brown',`<p>Each month, help participants registered with the foodbank fill out the paper form: bread, coffee or tea, cereal or oatmeal, <b>two</b> proteins, one staple, and any special needs. The participant and staff sign it, and it goes in the participant's file.</p><p>On the order date, enter each order in the foodbank's online form between <b>8 and 11 AM</b>, then mark it submitted under <a href="#foodbank">Foodbank Orders</a>. Orders are picked up on the Friday of that week.</p>`)}
  ${C('Staff Standards & Commitment','NH Employee Agreement','t-brown',`<ol>
   <li><b>Engagement &amp; growth:</b> goal-focused conversation; celebrate progress; share what you learn with leadership. Never connect through cigarettes or tobacco; no smoking or vaping in the courtyard or common areas.</li>
   <li><b>Daily environment care:</b> inside and outside sweeps, logged; flag maintenance or cleanliness issues.</li>
   <li><b>Food &amp; wellness:</b> meals arrive at the Admin Building and go out the same day; never in the communal fridge. Staff may place a meal safely inside the unit.</li>
   <li><b>Courtyard &amp; storage:</b> no belongings left outside units; work with participants on safe storage.</li>
   <li><b>Guest Unit:</b> guests sign in at the Admin Building; pre-check the unit; door closed during visits; check, sweep and check out after.</li>
   <li><b>Room Wellness Checks:</b> electrical tampering, tablet present and working, smoke detector, door handles, cleanliness and odours.</li>
   <li><b>Reporting:</b> urgent or safety issues go to Signal and an Incident Report; reports through the portal; shred paper copies once logged.</li>
   <li><b>Workplace care:</b> the last 20 minutes of each shift go to tidying the stock rooms, lounge and office.</li>
   <li><b>Boundaries:</b> no socializing outside work; never give or lend money, cigarettes, vapes, food, clothing, items or rides; no personal contact details.</li>
   <li><b>Admin Building security:</b> never left unattended; front door and office locked; tell your shift partner before you leave the area.</li></ol>
   <p class="meta" style="margin:0">Each staff member signs the agreement. Record the date on the Staff Roster.</p>`)}
  ${C('Shift handoff','NH 3.3.5','t-brown',`<p>Final 15 minutes of the shift, with a 10-minute overlap when possible. Cover participant updates, site updates, incidents (even low-level) and the “to follow up” list.</p><p>Shifts: Day 08:00–16:00 · Evening 16:00–00:00 · Night 00:00–08:00.</p>`)}
  ${C('Safety walkthroughs','NH 3.1.5 · 3.1.8','t-brown',`<p><b>Morning</b> 8–10 AM and <b>Midday</b> 12–2 PM: courtyard and paths, social areas, shared bathrooms/showers/laundry, Admin Building, micro-home exteriors.</p><p><b>Evening</b> 9:30–10 PM: emergency exits latched and locked, courtyard clear, shared spaces, Admin restock needs. Quiet hours reminder only. Participants don't have to leave.</p><p><b>Gate alarm:</b> arm, disarm and re-arm it exactly as set out in NH SOP 3.1.9 (in the binder). Report every activation as a near miss.</p>`)}
  ${C('When to call police','Safety · Incident Response Matrix','t-red',`<table>
   <tr><td><b>Firearm present</b></td><td>Don't approach. Evacuate if you can. <b>Call 911 now.</b> Notify a supervisor.</td></tr>
   <tr><td><b>Other weapon</b></td><td>Keep your distance and disengage. 911 if the threat is active; non-emergency if they won't leave.</td></tr>
   <tr><td><b>Assault / threats, fighting</b></td><td>Never step in physically. Ask them to leave if it's safe. 911 if anyone is in immediate danger, otherwise non-emergency.</td></tr>
   <tr><td><b>Harassment</b></td><td>Name the behaviour calmly and ask for it to stop. Police only if it becomes threats or violence.</td></tr>
   <tr><td><b>Substance-related disturbance, trespassing, refusing to leave</b></td><td>Ask them to leave if it's safe and don't escalate. Non-emergency line if they refuse.</td></tr></table>
   <p>Every case: consider a No Trespass notice, then report and document it in an Incident Report.</p>`)}
  ${C('Needle-stick or sharps injury','Safety · SOP','t-red',`<ol><li>Wash the area with soap and warm water. Let it bleed gently on its own; don't squeeze. Flush eyes, nose or mouth with clean water for several minutes.</li><li>Tell a supervisor right away. They arrange a ride to the emergency department (911 if there is urgent medical distress).</li><li>Go to hospital as soon as possible, for an exposure assessment and preventive treatment if needed.</li><li>Keep others away from the area. Don't recap or handle the sharp.</li><li>Complete an Incident Report the same day.</li></ol><p>The manager checks in within 24 hours and supports appointments and WorkSafeNB reporting.</p>`)}
  ${C('Picking up a used needle','Safety · Community SOP','t-red',`<ol><li>Put on puncture-resistant gloves first.</li><li>Pick it up by the barrel with the sharp end away from you. Never bend, break or recap it.</li><li>Put it straight into a sharps bin. Never in the garbage, recycling or a toilet.</li><li>Remove the gloves and wash your hands.</li><li>Log the date, time, exact location and what you did.</li></ol><p>Only trained staff dispose of sharps. If no one trained is available, keep the area clear and wait for support.</p>`)}
  ${C('Fire','Safety · Fire Evacuation','t-red',`<p><b>Small fire:</b> have someone call 911 while you get the ABC extinguisher. <b>P</b>ull the pin, <b>A</b>im at the base of the fire nearest you, <b>S</b>queeze, <b>S</b>weep. If it empties and the fire isn't out, confirm 911 was called.</p>
   <p><b>Evacuate:</b> sound the alarm, leave everything, close doors behind you and help anyone who needs it. Tell 911 the exact unit or space, what you see and whether anyone is trapped.</p>
   <p><b>At the meeting point:</b> take a headcount from the sign-in sheets and in/out log, report anyone missing to responders, keep the access route clear, and don't re-enter until responders say it's safe.</p>
   <p><b>Trapped:</b> stay low, block gaps under the door, signal from a window and call 911 with your location.</p>`)}
  ${C('Severe weather','Safety · SOP','t-red',`<p><b>Before:</b> watch Environment Canada alerts. Secure outdoor furniture, close windows and doors, charge phones, and check the 3-day supply of water, food, flashlights, batteries, blankets and first aid.</p><p><b>During:</b> shelter in place unless authorities say to evacuate. Use flashlights, never candles. Avoid floodwater. In extreme cold, check on participants with health concerns and keep paths clear of snow and ice.</p><p><b>After:</b> look for downed lines, gas leaks, fallen trees and flooding, and report them. Document damage with the Operations Lead and debrief.</p>`)}
  ${C('Security threat / lockdown','Safety · Community Security Threat','t-red',`<ol><li>Keep yourself safe and assess from a distance. Trust your instincts.</li><li>Call 911: location, description, weapons seen, direction of travel.</li><li>If a lockdown is needed: everyone into the nearest building, lock doors and windows, lights off, stay quiet and out of sight, phones silenced.</li><li>Secure access points if it is safe. One person speaks with police. Use text or approved apps for updates; stay off social media.</li><li>Evacuate only if police direct it, then take a headcount.</li><li>Wait for police to give the all-clear. Offer first aid and emotional support, then debrief and document.</li></ol>`)}
  ${C('Power, water or heat outage','Safety · Utility Failure','t-red',`<p>Find out whether it affects one unit or the whole site. Check breakers if you can, report it to the utility, and tell the on-call manager. Tell participants what is happening and what to do.</p><p><b>Power:</b> flashlights, not candles. Unplug electronics, keep fridges closed, and check on anyone who relies on powered medical equipment or refrigerated medication. Set up a warm common area and blankets in cold weather.</p><p><b>Water:</b> use stored water for drinking and hygiene. Arrange delivery if it lasts beyond 24 hours.</p><p>Call 911 for injuries or immediate danger, such as flooding or fire risk. Afterwards, inspect for damage and restock emergency supplies.</p>
   <p class="meta">NB Power emergency 1-800-663-6272 · Environmental spills 1-800-565-1633 · WorkSafeNB 1-800-999-9775</p>`)}
  ${C('Spills, electrical problems, equipment','Safety · Emergency Response','t-red',`<p><b>Chemical spill:</b> get the spill kit, put on its PPE, clean up, then report it to a supervisor. Large spills are reported to the Department of Environment.</p><p><b>Electrical emergency:</b> turn off the power if safe, then report it right away.</p><p><b>Equipment fault:</b> stop using it, disconnect the power, then report it and make a work order.</p><p><b>First aid:</b> make the area safe, call the designated first aider, and call 911 for anyone unconscious or seriously hurt. Never let an injured person drive themselves to hospital.</p>`)}
  ${C('New hazardous products & SDS','Safety · WHMIS','t-red',`<p>When a new cleaning or hazardous product arrives: send its Safety Data Sheet to the Safety Committee (ask the supplier if it didn't come with the shipment), and make sure it has a WHMIS workplace label: product name, precautions and a reference to the SDS.</p><p>The site's SDS binder is in the safety zone and must stay current. Participants never keep cleaning products: staff dispense measured amounts.</p>`)}
  ${C('Monthly safety audit','Safety · NH Safety Audit Checklist','t-red',`<p>Once a month a supervisor or designated staff member walks the whole site with the <a href="#safetyaudit">Monthly Safety Audit</a>, scoring each area Yes / No / N/A. Every No becomes an action item with an owner and a due date, and repairs also get a work order. Results go to the Safety Committee's monthly meeting.</p>`)}
  ${C('First aid kits','Safety · Kit Contents Checklist','t-red',`<p>Check every kit weekly and after each use with the <a href="#firstaid">First Aid Kit Check</a>. Minimums include a full box of gloves, 2–3 CPR face shields, <b>2–4 naloxone kits</b>, wipes, saline, bandages and dressings, tape, eye pads and eye wash, scissors, tweezers, burn gel and ice packs. Low items can go straight to Requisitions.</p>`)}
  ${C('Guest Unit','Guest Unit Policy','t-brown',`<p>Open <b>8:00 AM – 8:00 PM</b>. Last booking starts at <b>6:00 PM</b>, and bookings are <b>2 hours</b> at most. Book ahead when possible: the participant and their guest both sign the sheet in the yellow binder, and staff record it under <a href="#guestunit">Guest Unit Bookings</a>.</p><ul><li>The guest stays with the participant the whole time and is never in the unit alone.</li><li>Former 12 Neighbours participants can't be guests.</li><li>It is for approved visits only, not a warming space. No smoking.</li></ul><p>When the guidelines aren't followed, document what happened. A manager decides on any pause in Guest Unit privileges.</p>`)}
  ${C('Inventory routine','Inventory SOP','t-brown',`<p><b>Weekly audit:</b> office → staff bathroom → guest unit. Update the counts with the − / + buttons, then mark the audit complete.</p><p><b>Taking supplies:</b> subtract from the room you took them from. <b>Deliveries:</b> put them away, then add them to that room.</p><p><b>Par 0</b> means on demand: never reordered automatically. Keep storage notes current when surplus moves.</p><p><b>Ordering:</b> <i>Draft restock email</i> lists out-of-stock items as Critical and low-stock items as Recommended, ready to send to the site's restock contact. Broken equipment: set its condition to Needs Repair and its status to Needs Maintenance or Required, with a note.</p>`)}
  ${!isHousing()?housingCards(C):''}
  </div>`}

      ${s.status==='Archived'&&k!==curSite()?`<button class="btn sm" type="button" data-view="${esc(k)}">View records</button>`:''}</td></tr>`}).join('')}</tbody></table></div>
    ${ad?`<button class="btn pri" type="button" id="addSite" style="margin-top:10px">＋ Open a new site</button>`:''}</div>
   <div class="card"><b style="font-size:16px">Export</b>

    ${SHEET_URL||ARCHIVE_URL?`<div class="qa" style="margin-top:8px">${SHEET_URL?`<a class="btn" href="${esc(SHEET_URL)}" target="_blank" rel="noopener">Open the data sheet ↗</a>`:''}${ARCHIVE_URL?`<a class="btn" href="${esc(ARCHIVE_URL)}" target="_blank" rel="noopener">Open the records folder in Drive ↗</a>`:''}</div>`:''}

    <table style="margin-top:8px">${MODS.map(m=>`<tr><td>${esc(M[m].nav)}</td><td style="text-align:right;font-variant-numeric:tabular-nums">${recs(m).length}</td></tr>`).join('')}</table>
    <hr style="border:0;border-top:1px solid var(--line);margin:14px 0">
    <b>Import a backup</b><p class="meta" style="margin-top:2px">Adds the entries, staff and participants from a backup (.json) file. Records already here are kept.${!CAN_WRITE?' Needs Staff or Admin access.':''}</p>

   <div class="card"><b style="font-size:16px">Organization</b>
    <div class="fld" style="margin-top:8px"><label for="portalUrl">12N Staff Portal link</label><input id="portalUrl" type="url" ${dis} value="${esc(CFG&&CFG.portalUrl||'')}" placeholder="https://sites.google.com/…"><span class="hint">Shown in the menu so staff can jump to the portal.</span></div>
    ${MODE==='api'?`<hr style="border:0;border-top:1px solid var(--line);margin:14px 0"><b>This device</b><p class="meta" style="margin-top:2px">Signed in as ${esc(MY_UID||'')}. ${PENDING?`<b>${PENDING} change${PENDING>1?'s are':' is'} waiting to sync.</b>`:'Everything is synced.'}</p><div class="qa">${INSTALL_PROMPT?'<button class="btn pri" type="button" id="installApp">Install this app</button>':''}<button class="btn" type="button" id="syncNow">Sync now</button><button class="btn danger" type="button" id="signOut">Sign out of this device</button></div>`:''}
